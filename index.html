<style>
:root{
  /* Brand tokens — swap this block to re-skin as a different app */
  --bg:#1A1D2E; --s1:#23273B; --s2:#2D3249; --s3:#383E58; --line:#3E4563;
  --tx:#F2F0EA; --mu:#9AA0B8; --ac:#FFD23F; --ac-ink:#231B00; --bad:#FF5C7A;
  --r:18px;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
  --peek:calc(84px + var(--sb));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:15px;height:15px}
.icon.fill{fill:currentColor;stroke-width:1.5}
.imgicon{border-radius:50%;object-fit:cover;display:block;flex:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:var(--sl);padding-right:var(--sr)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);flex:none}

/* ---------- Dashboard ---------- */
#dash{padding-left:0;padding-right:0}
#dashTop{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--st) var(--sr) 0 var(--sl)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 12px 8px 16px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:.01em;line-height:1}
.brand svg{width:30px;height:30px;flex:none}
.count{color:var(--mu);font-size:13px}
.cards{flex:1;overflow-y:auto;padding:4px 14px calc(var(--dh,var(--peek)) + 88px);display:flex;flex-direction:column;gap:10px}
.wcard{position:relative;flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"title edit" "meta play" "rail rail";column-gap:10px;row-gap:2px;align-items:center;background:var(--s1);border-radius:var(--r);padding:10px 12px 12px 18px;overflow:hidden;cursor:pointer}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.wcard:active{background:var(--s2)}
.wcard h3{grid-area:title;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmeta{display:flex;align-items:center;gap:10px;min-width:0}
.wcard .wmeta{grid-area:meta}
.wcard .rail{grid-area:rail}
.wdur{font-family:var(--disp);font-size:40px;font-weight:700;line-height:1}
.wdur small{font-size:18px;color:var(--mu);margin-left:2px}
.wsub{color:var(--mu);font-size:13px;line-height:1.3;min-width:0}
.editbtn{grid-area:edit;justify-self:center;width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center}
.playbtn{grid-area:play;justify-self:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--ci,#15131f);display:grid;place-items:center}
.playbtn .icon{width:18px;height:18px;margin-left:2px}
.wcard.live .playbtn{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
.newcard{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mu);padding:20px}
.newcard b{font-size:18px;color:var(--tx);font-weight:600}
.newcard .icon{width:34px;height:34px;color:var(--ac)}

/* Railroad timeline */
.rail{position:relative;display:flex;align-items:center;height:32px;margin-top:10px;overflow:hidden}
.rail.over{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.rail::before{content:"";position:absolute;left:10px;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line)}
.rail::after{content:"";position:absolute;left:10px;right:0;top:50%;height:10px;margin-top:-5px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 9px);opacity:.6}
.rail .fillbar{position:absolute;left:10px;right:0;top:50%;height:3px;margin-top:-1.5px;background:linear-gradient(90deg,var(--c),var(--c2,var(--c)));z-index:1;border-radius:2px;transform-origin:0 50%;transform:scaleX(0);will-change:transform}
.rail.empty{color:var(--mu);font-size:13px}
.rail.empty::before,.rail.empty::after{display:none}
.seg{flex:var(--g) 1 0px;min-width:32px;display:flex;align-items:center;position:relative;z-index:2}
.stop{width:26px;height:26px;border-radius:50%;background:var(--s2);border:2px solid var(--c);color:var(--c);display:grid;place-items:center;overflow:hidden;transition:transform .2s,background .2s}
.stop .icon{width:14px;height:14px}
.stop .imgicon{width:100%;height:100%}
.stop .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.seg.done .stop{background:var(--c);color:var(--ci,#15131f)}
.seg.done .dot{background:var(--ci,#15131f)}
.seg.cur .stop{transform:scale(1.25);background:var(--c);color:var(--ci,#15131f);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent)}
.seg.cur .dot{background:var(--ci,#15131f)}

/* Chart drawer: tucked at the bottom, can be pulled up over the whole dashboard */
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:12;height:var(--peek);display:flex;flex-direction:column;overflow:hidden;background:var(--s1);border-radius:26px 26px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.35);padding:0 calc(16px + var(--sr)) calc(10px + var(--sb)) calc(16px + var(--sl));transition:height .32s cubic-bezier(.2,.9,.25,1),border-radius .32s,padding-top .32s}
.drawer.dragging{transition:none}
.drawer.full{border-radius:0;padding-top:var(--st)}
.drawer>*{width:100%;max-width:760px;margin-left:auto;margin-right:auto}
.dhandle{flex:none;height:24px;position:relative;touch-action:none;cursor:grab;border-radius:12px}
.dhandle::after{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--s3)}
.drawer .chead{flex:none;touch-action:none;cursor:grab;padding-bottom:4px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ctitle{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.1}
.cinfo{color:var(--mu);font-size:13px}
.rng{display:flex;background:var(--s2);border-radius:10px;padding:3px}
.rng button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mu)}
.rng button.on{background:var(--s3);color:var(--tx)}
.chart{flex:1;min-height:0;position:relative;margin-top:6px;overflow:hidden}
.chart.archive{flex:none;height:210px;margin:4px 6px 0}
.chart svg{display:block}
.chart .grid{stroke:var(--line);stroke-dasharray:2 4}
.chart .yl,.chart .xl{fill:var(--mu);font-size:11px;font-family:var(--body)}
.chart .xl.today{fill:var(--tx);font-weight:700}
.chart .sel{fill:rgba(255,255,255,.05)}
.cempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mu);text-align:center;padding:0 20px;font-size:14px}
.cempty .bars{display:flex;align-items:flex-end;gap:8px;height:60px}
.cempty .bars i{width:16px;border-radius:4px;background:var(--s2)}
.legend{display:flex;gap:6px;overflow-x:auto;font-size:12px;color:var(--mu);padding-top:6px;min-height:30px;scrollbar-width:none}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--s2);font-weight:600;font-size:13px;color:var(--tx)}
.chip.on{background:var(--ac);color:var(--ac-ink)}

/* Draggable action buttons */
.fab{position:absolute;left:calc(100% - 72px - var(--sr));width:56px;height:56px;border-radius:18px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:left .3s cubic-bezier(.2,.9,.25,1),scale .15s,box-shadow .15s;z-index:6}
.fab[data-side=left]{left:calc(16px + var(--sl))}
.fab.lifted{scale:1.15;box-shadow:0 16px 36px rgba(0,0,0,.55)}
.fab .icon{width:28px;height:28px;stroke-width:2.6}
#dashFab{bottom:calc(var(--peek) + 14px)}
#editFab{top:50%;margin-top:-28px}
.dz{position:absolute;width:56px;height:56px;border-radius:18px;border:2px dashed var(--mu);opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.dropping .dz{opacity:.45}
.dz.l{left:calc(16px + var(--sl))}.dz.r{right:calc(16px + var(--sr))}
#dashTop .dz{bottom:calc(var(--peek) + 14px)}
#editor .dz{top:50%;margin-top:-28px}

/* Floating "back to workout" button */
#miniRun{position:absolute;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:0 14px;height:44px;border-radius:999px;background:var(--c);color:var(--ci,#15131f);font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.45)}
#miniRun .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#miniRun .mtime{font-family:var(--disp);font-size:20px;font-weight:700}
#miniRun .mdot{width:8px;height:8px;border-radius:50%;background:var(--ci,#15131f);flex:none;animation:pulse 1.2s infinite}
#miniRun.paused .mdot{animation:none;opacity:.4}
@keyframes pulse{50%{opacity:.25}}
#settings>#miniRun{bottom:calc(18px + var(--sb))}
#detail>#miniRun{bottom:calc(96px + var(--sb))}
#editor>#miniRun{bottom:calc(18px + var(--sb))}
body.pill .dlist{padding-bottom:calc(150px + var(--sb))}
body[data-screen=detail] #toast{bottom:calc(100px + var(--sb))}
body.pill[data-screen=detail] #toast{bottom:calc(150px + var(--sb))}
body.pill[data-screen=editor] #toast,body.pill[data-screen=settings] #toast{bottom:calc(74px + var(--sb))}
body[data-screen=dash] #toast{bottom:calc(var(--peek) + 84px)}

/* ---------- Detail (read-only) ---------- */
#detail{background:var(--bg);z-index:8}
.ehead{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--st)) 12px 6px}
.dname{flex:1;min-width:0;font-family:var(--disp);font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.dstats{display:flex;align-items:center;gap:12px;padding:4px 18px 0}
.dcues{padding:4px 18px 0;color:var(--mu);font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.drail{padding:0 18px 8px}
.dlist{flex:1;overflow-y:auto;padding:6px 12px calc(110px + var(--sb));display:flex;flex-direction:column;gap:8px}
.drow{flex:none;display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:14px;padding:10px 12px}
.dnum{font-family:var(--disp);color:var(--mu);font-size:18px;min-width:18px;text-align:center}
.dico{width:34px;height:34px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;flex:none;overflow:hidden}
.dico .icon{width:17px;height:17px}
.dico .imgicon{width:100%;height:100%}
.dmain{flex:1;min-width:0}
.dmain b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmain small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dthumb{width:52px;height:36px;border-radius:8px;overflow:hidden;position:relative;flex:none;background:var(--s2)}
.dthumb:empty{display:none}
.ddur{font-family:var(--disp);font-size:24px;font-weight:700}
.dfoot{position:absolute;left:0;right:0;bottom:0;padding:14px calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl));background:linear-gradient(transparent,var(--bg) 35%)}
.btn{flex:1;padding:14px;border-radius:14px;background:var(--s2);font-weight:600}
.btn.pri{background:var(--ac);color:var(--ac-ink)}
.btn.danger{background:var(--bad);color:#2a0009}
.btn.big{width:100%;padding:17px;font-size:18px;display:flex;justify-content:center;align-items:center;gap:10px;background:var(--c);color:var(--ci,#15131f)}

/* ---------- Editor ---------- */
#editor{background:var(--bg);z-index:10}
.namein{flex:1;min-width:0;background:transparent;border:0;font-family:var(--disp);font-size:26px;font-weight:700;outline:none;padding:4px 6px;border-radius:8px}
.namein:focus{background:var(--s1)}
.swatch{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line);flex:none;margin:0 6px}
.etotal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 14px 10px 18px;color:var(--mu);font-size:14px}
.etotal .chip .icon{color:var(--c)}
.ilist{flex:1;overflow-y:auto;padding:4px 12px calc(50vh + 48px);padding-bottom:calc(50dvh + 48px);display:flex;flex-direction:column;gap:12px}
.icard{flex:none;background:var(--s1);border-radius:var(--r);padding:12px}
.ititle{display:flex;align-items:center;gap:8px}
.iconpick{width:40px;height:40px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mu);flex:none;overflow:hidden}
.iconpick.set{border:0;background:var(--c);color:var(--ci,#15131f)}
.iconpick .imgicon{width:100%;height:100%;border-radius:0}
.tin{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid transparent;font-size:18px;font-weight:600;padding:6px 2px;outline:none}
.tin::placeholder{color:var(--mu);font-weight:500}
.tin:focus{border-color:var(--c)}
.inum{font-family:var(--disp);color:var(--mu);font-size:18px;font-weight:600}
.more{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--mu)}
.ibody{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:10px;align-items:start}
.media{position:relative;width:100%;aspect-ratio:16/9;max-height:34vh;border-radius:12px;background:var(--s2);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu);font-size:12px;overflow:hidden}
.media.has{border:0;background:#0d0f18}
.mslot img,.mslot video,.rmedia img,.rmedia video,.dthumb img,.dthumb video{position:absolute;inset:0;width:100%;height:100%}
.x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(10,10,20,.65);color:#fff;display:grid;place-items:center;z-index:2}
.fitbadge{position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(10,10,20,.65);color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
.audio{position:relative;width:100%;margin-top:6px;height:32px;border-radius:10px;background:var(--s2);display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;color:var(--mu);font-size:12px;text-align:left}
.audio .wave{flex:1;height:22px;min-width:0}
.audio .wave rect{fill:var(--c)}
.audio.playing .wave rect{fill:var(--tx)}
.xa{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.clockmini{width:100%;max-width:40vh;aspect-ratio:1;display:block;margin:0 auto}
.clockmini svg{width:100%;height:100%;display:block}
.ctrack{fill:var(--s2);stroke:var(--s3);stroke-width:8}
.carc{fill:none;stroke:var(--c);stroke-width:8;stroke-linecap:round}
.cfull{fill:none;stroke:var(--c);stroke-width:8;opacity:.3}
.ctick{stroke:var(--mu);stroke-width:1.5;opacity:.5}
.cval{fill:var(--tx);font-family:var(--disp);font-weight:700}
.cunit{fill:var(--mu);font-size:10px;font-family:var(--body)}
.cues{display:flex;gap:8px;margin-top:10px}
.cue{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;background:var(--s2);font-size:13px;font-weight:600;text-align:left}
.cue .icon{color:var(--c)}
.cue span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cue em{font-style:normal;color:var(--mu);font-weight:500}
.cue.inh span{color:var(--mu);font-weight:500}
.hint{flex:none;border:2px dashed var(--line);border-radius:var(--r);padding:26px 20px;color:var(--mu);text-align:center;font-size:15px;line-height:1.4}
.hint b{display:block;color:var(--tx);font-size:18px;margin-bottom:4px}

/* ---------- Dial ---------- */
#dial{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,9,16,0);transition:background .28s;padding:max(16px,var(--st)) max(16px,var(--sr)) max(16px,var(--sb)) max(16px,var(--sl))}
#dial.open{background:rgba(8,9,16,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dialcard{width:min(100%,380px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--s1);border-radius:28px;padding:16px;transform-origin:0 0;--c:var(--ac)}
.modes{display:flex;background:var(--s2);border-radius:12px;padding:3px}
.modes button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--mu)}
.modes button.on{background:var(--s3);color:var(--tx)}
.dialsvg{width:min(100%,calc(100vh - 290px));width:min(100%,calc(100dvh - 290px));min-width:160px;aspect-ratio:1;touch-action:none;display:block;margin:8px auto 6px;user-select:none;-webkit-user-select:none}
.dtrack{fill:none;stroke:var(--s2)}
.darc{fill:none;stroke:var(--c);stroke-linecap:round}
.dfull{fill:none;stroke:var(--c);opacity:.28}
.dknob{fill:var(--tx);stroke:var(--s1);stroke-width:3}
.dtick{stroke:var(--mu);opacity:.45}
.dval{fill:var(--tx);font-family:var(--disp);font-weight:700}
.dsub{fill:var(--mu);font-size:13px;font-family:var(--body)}
.dlap{fill:var(--c);font-size:12px;font-weight:600;font-family:var(--body)}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dialfoot{display:flex;gap:8px;margin-top:14px}

/* ---------- Sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);display:flex;align-items:flex-end;transition:background .25s}
#sheet.open{background:rgba(0,0,0,.5)}
.sheetin{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;margin:0 auto;background:var(--s1);border-radius:24px 24px 0 0;padding:0 16px calc(16px + var(--sb));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.25,1)}
#sheet.open .sheetin{transform:none}
.grab{position:sticky;top:0;z-index:3;display:block;width:calc(100% + 32px);height:30px;margin:0 -16px 6px;background:var(--s1);border-radius:24px 24px 0 0;touch-action:none;cursor:grab}
.grab::after{content:"";position:absolute;left:50%;top:12px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--s3)}
.grab:active::after,.sheetin.dragging .grab::after{background:var(--mu)}
.sheetin.dragging{transition:none}
#sheetBody>h4{touch-action:none}
.sheetin h4{margin:0 0 12px;font-family:var(--disp);font-size:22px;font-weight:700}
.sheetin p{color:var(--mu);margin:0 0 16px;line-height:1.4}
.sheetin p.small{font-size:12px;margin:0 4px 8px}
.sect{color:var(--mu);font-size:13px;margin:14px 4px 6px}
.icongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icongrid button{aspect-ratio:1;border-radius:16px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--mu);overflow:hidden}
.icongrid button .icon{color:var(--tx);width:26px;height:26px}
.icongrid button .imgicon{width:34px;height:34px}
.icongrid button.on{background:var(--ac);color:var(--ac-ink)}
.icongrid button.on .icon{color:var(--ac-ink)}
.menu button{display:flex;width:100%;padding:14px 12px;border-radius:12px;gap:14px;align-items:center;font-weight:600;font-size:16px;text-align:left}
.menu button:active{background:var(--s2)}
.menu button.on{color:var(--ac)}
.menu button span.val{margin-left:auto;color:var(--mu);font-weight:500;font-size:14px}
.menu .red{color:var(--bad)}
.cuerow{display:flex;align-items:center;gap:6px}
.cuerow>button:first-child{flex:1;min-width:0}
.menu .cuerow .prev{width:40px;padding:0;justify-content:center}
.prev{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
.ttsrow{display:flex;gap:6px;align-items:center;margin:4px 0 6px}
.ttsrow input{flex:1;min-width:0;background:var(--s2);border:0;border-radius:12px;padding:11px 12px;outline:none}
.fitrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fitrow button{padding:10px 4px;border-radius:12px;background:var(--s2);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.fitrow button.on{background:var(--ac);color:var(--ac-ink)}
.fitrow i{width:34px;height:24px;border:2px solid currentColor;border-radius:4px;position:relative;overflow:hidden}
.fitrow i::after{content:"";position:absolute;background:currentColor;opacity:.5}
.fit-cover i::after{inset:-4px -2px}
.fit-contain i::after{left:9px;right:9px;top:0;bottom:0}
.fit-fill i::after{inset:0;border-radius:40%}
.fit-none i::after{left:12px;right:12px;top:6px;bottom:6px}

/* Recorder */
.recbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 10px}
.rectime{font-family:var(--disp);font-size:46px;font-weight:700;line-height:1}
.recwave{display:flex;align-items:center;gap:3px;height:40px}
.recwave i{width:4px;border-radius:2px;background:var(--bad);height:3px;transition:height .08s}
.recbtn{width:78px;height:78px;border-radius:50%;border:4px solid var(--tx);display:grid;place-items:center}
.recbtn i{width:56px;height:56px;border-radius:50%;background:var(--bad);transition:.2s}
.recbtn.on i{width:28px;height:28px;border-radius:6px}
.recstat{color:var(--mu);font-size:14px;text-align:center}

/* Crop */
.cropview{position:relative;width:min(72vw,260px,calc(100vh - 210px));width:min(72vw,260px,calc(100dvh - 210px));min-width:150px;aspect-ratio:1;margin:0 auto;overflow:hidden;border-radius:16px;touch-action:none;background:#000;cursor:grab}
.cropview img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;pointer-events:none}
.cropview::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.5);border:2px solid #fff;pointer-events:none}
.zoom{width:100%;margin:16px 0 4px;accent-color:var(--ac)}

/* Camera */
#cam{position:fixed;inset:0;z-index:60;background:#000;color:#fff}
#camV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camV.mirror{transform:scaleX(-1)}
.camerr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(64px + var(--st)) 30px calc(24px + var(--sb));z-index:1;text-align:center}
.camerr .btn{flex:none;padding:14px 22px}
.camtop{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + var(--st)) calc(14px + var(--sr)) 12px calc(14px + var(--sl));pointer-events:none}
.camtop>*,.cambot>*{pointer-events:auto}
#cam.err .cambot,#cam.err #camFlip{display:none}
.camtop .iconbtn{background:rgba(0,0,0,.45);color:#fff}
#camTime{background:var(--bad);padding:4px 10px;border-radius:8px;font-weight:600}
#camTime:empty{visibility:hidden}
.cambot{position:absolute;z-index:2;left:0;right:0;bottom:0;pointer-events:none;padding:16px 16px calc(24px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:16px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.cambot .modes{width:210px;background:rgba(0,0,0,.5)}
.cambot .modes button.on{background:rgba(255,255,255,.2);color:#fff}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{width:60px;height:60px;border-radius:50%;background:#fff;transition:.2s}
.shutter.vid i{background:var(--bad)}
.shutter.on i{width:30px;height:30px;border-radius:7px}

/* ---------- Runner ---------- */
#run{z-index:30;background:radial-gradient(130% 70% at 50% 0%,color-mix(in srgb,var(--c) 30%,var(--bg)) 0%,var(--bg) 72%);padding:var(--st) var(--sr) var(--sb) var(--sl)}
.rhead{display:flex;align-items:center;gap:10px;padding:10px 14px}
.rhmid{flex:1;min-width:0;text-align:center}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rleft{color:var(--mu);font-size:13px}
/* The stage is a size container: the ring and media are sized from the space actually
   left between the header and the controls, so nothing can spill over them. */
.rstage{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 20px;overflow:hidden;container-type:size;--rw:min(78cqw,calc(66cqh - 82px),340px)}
.rmedia{width:100%;max-width:520px;height:30vh;height:34cqh;flex:none;border-radius:20px;overflow:hidden;position:relative;background:#0d0f18}
.rmedia:empty{display:none}
.rcore{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;width:min(100%,max(var(--rw),210px))}
.ring{position:relative;flex:none;aspect-ratio:1;container-type:inline-size;width:var(--rw)}
#run.nomedia .rstage{--rw:min(78cqw,calc(100cqh - 82px),360px)}
.ring svg{width:100%;height:100%;display:block}
.rtrack{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
.rarc{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round;stroke-dasharray:565.49}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 15%;pointer-events:none}
.ricon{line-height:0}
.ricon .icon{width:30px;height:30px;width:clamp(16px,9cqi,32px);height:clamp(16px,9cqi,32px);color:var(--c)}
.ricon .imgicon{width:46px;height:46px;width:clamp(22px,14cqi,48px);height:clamp(22px,14cqi,48px);border:2px solid var(--c)}
.rtitle{font-size:clamp(16px,4.6vw,22px);font-size:clamp(11px,6.4cqi,22px);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.rtime{font-family:var(--disp);font-size:clamp(56px,19vw,104px);font-size:clamp(24px,30cqi,104px);font-weight:700;line-height:.95;white-space:nowrap}
.rtime.long{font-size:clamp(20px,21cqi,76px)}
#run.paused .rtime{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rnext{color:var(--mu);font-size:15px;line-height:20px;min-height:20px;max-width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrail{padding:0 18px}
.rctrl{display:flex;justify-content:center;align-items:center;gap:28px;padding:16px 0 20px}
.rctrl button{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.rctrl .big{width:82px;height:82px;background:var(--c);color:var(--ci,#15131f)}
.rctrl .big .icon{width:30px;height:30px}
/* Media placeholders, upload state, capture fallbacks */
.mmiss{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);font-size:12px;text-align:center;padding:6px}
.dthumb .mmiss{font-size:0}
.media.busy,.audio.busy{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
#recAlt{margin-top:4px}
.camerr p{color:rgba(255,255,255,.8);line-height:1.45;margin:0 0 4px}
.camerr .btn{min-width:220px}

/* ---------- v4 additions ---------- */
.icon.xs{width:12px;height:12px;vertical-align:-1px;margin-right:4px}
.cards .sample{align-self:center;flex:none}
.wsub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#peekProbe{position:absolute;left:0;bottom:0;width:1px;height:var(--peek);visibility:hidden;pointer-events:none}

/* Running and scheduled workouts */
.runs{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;flex:none;scrollbar-width:none}
.runs::-webkit-scrollbar{display:none}
.runs:empty{display:none}
.runchip{flex:none;display:flex;align-items:center;gap:8px;height:40px;max-width:250px;padding:0 14px 0 12px;border-radius:999px;background:var(--c);color:var(--ci,#15131f);font-weight:600}
.runchip .mt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runchip .mtime{font-family:var(--disp);font-size:18px;font-weight:700;white-space:nowrap}
.mdot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.2s infinite}
.runchip.paused .mdot,.runchip.done .mdot,#miniRun.done .mdot{animation:none;opacity:.4}
.runchip.wait,#miniRun.wait,.runchip.done{background:var(--s2);color:var(--tx);box-shadow:inset 0 0 0 2px var(--c)}
.runchip.wait .mdot,#miniRun.wait .mdot{animation:none;background:var(--c)}
#miniRun .mcount{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.18);flex:none}
#miniRun .mcount:empty{display:none}

/* Detail: runs of this workout, timed start */
.dfoot{display:flex;gap:10px}
.dfoot .btn.big{width:auto}
.btn.sq{flex:none;width:58px;padding:0;display:grid;place-items:center;background:var(--s2)}
.druns,.drows{flex:none;display:flex;flex-direction:column;gap:8px}
.druns:empty{display:none}
.chead>div:first-child{flex:1;min-width:0}
.drawer[data-snap=peek]:not(.dragging) .cinfo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drun{flex:none;display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:inset 4px 0 0 var(--c)}
.drun .chip{flex:none;padding:8px 12px}
.chip.ico{width:36px;padding:8px;justify-content:center}

/* Timing sheet */
.tsel{width:100%;background:var(--s2);border:0;border-radius:12px;padding:12px;margin:0 0 10px;color:var(--tx);font:inherit;font-weight:600}
.trow{display:grid;grid-template-columns:54px minmax(0,1fr) minmax(0,1.14fr);gap:6px;align-items:center;padding:6px 6px 6px 12px;border-radius:14px;margin-bottom:8px;background:var(--s2);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.trow.pin{box-shadow:inset 0 0 0 2px var(--ac)}
.trow label{font-weight:600}
.trow input{min-width:0;width:100%;background:var(--s1);border:0;border-radius:10px;padding:10px 6px;color:var(--tx);font:inherit;font-variant-numeric:tabular-nums}
@media (max-width:380px){.trow{grid-template-columns:1fr 1fr}.trow label{grid-column:1/-1;padding-top:2px}}
.tquick{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.tprev{color:var(--mu);font-size:14px;margin:12px 4px 4px;line-height:1.4;min-height:40px}
.tprev.bad{color:var(--bad)}
.seg3{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px}
.seg3 button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mu);white-space:nowrap}
.seg3 button.on{background:var(--s3);color:var(--tx)}
select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Settings */
#settings{background:var(--bg);z-index:9}
.setlist{flex:1;overflow-y:auto;padding:4px 12px calc(28px + var(--sb))}
body.pill .setlist{padding-bottom:calc(84px + var(--sb))}
.sgroup{background:var(--s1);border-radius:var(--r);padding:6px;margin-bottom:14px}
.sgroup h5{margin:8px 10px 4px;font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}

    return `<div class="seg ${st}" data-si="${si}" style="--g:${Math.max(it.duration,1)}"${tap?` data-j="${i}"`:''}><span class="stop">${it.icon||it.iconImg?iconFor(it):'<i class="dot"></i>'}</span></div>`}).join('')}</div>`;
}

/* Bottom sheet. onPick: [data-v] (closes). opts.onKeep: [data-keep] (stays open). opts.onClose: cleanup. */
let sheetT,sheetClose=null;
function openSheet(html,onPick,opts={}){
  clearTimeout(sheetT);
  const prev=sheetClose;sheetClose=null;prev?.();
  const sh=$('#sheet'),box=$('.sheetin');
  $('#sheetBody').innerHTML=html;sh.classList.remove('hidden');
  sh.style.background='';box.style.transform='';box.classList.remove('dragging');
  box.scrollTop=0;
  sheetClose=opts.onClose||null;
  requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add('open')));
  sh.onclick=e=>{
    if(e.target===sh){closeSheet();return}
    const k=e.target.closest('[data-keep]');
    if(k){opts.onKeep?.(k.dataset.keep,k);return}
    const b=e.target.closest('[data-v]');
    if(b&&!b.disabled){const v=b.dataset.v;const r=onPick?.(v,b,true);closeSheet();r?.then?.(()=>{})}
  };
}
function closeSheet(){
  const f=sheetClose;sheetClose=null;f?.();
  const sh=$('#sheet'),box=$('.sheetin');
  box.classList.remove('dragging');box.style.transform='';sh.style.background='';
  sh.classList.remove('open');sheetT=setTimeout(()=>sh.classList.add('hidden'),280);
}
function bindSheetDrag(){
  const sh=$('#sheet'),box=$('.sheetin'),grab=$('#sheetGrab');
  let st=null,dragged=false;
  box.addEventListener('pointerdown',e=>{
    if(e.button>0||!sh.classList.contains('open')||!e.target.closest('#sheetGrab,#sheetBody>h4'))return;
    st={y:e.clientY,pid:e.pointerId,ly:e.clientY,lt:performance.now(),v:0,moved:false,onGrab:!!e.target.closest('#sheetGrab')};
  });
  box.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.pid)return;
    const dy=Math.max(0,e.clientY-st.y);
    if(!st.moved){
      if(dy<6)return;
      st.moved=true;box.classList.add('dragging');
      try{box.setPointerCapture(e.pointerId)}catch(_){}
    }
    const t=performance.now();st.v=(e.clientY-st.ly)/Math.max(1,t-st.lt);st.ly=e.clientY;st.lt=t;
    box.style.transform=`translateY(${dy}px)`;
    sh.style.background=`rgba(0,0,0,${(.5*Math.max(0,1-dy/Math.max(1,box.offsetHeight))).toFixed(3)})`;
  });
  const end=e=>{
    if(!st||e.pointerId!==st.pid)return;
    const s=st;st=null;
    if(!s.moved){if(s.onGrab)closeSheet();return}
    dragged=true;setTimeout(()=>{dragged=false},0);
    box.classList.remove('dragging');
    const dy=Math.max(0,e.clientY-s.y);
    if(dy>Math.min(140,box.offsetHeight*.3)||(s.v>.45&&dy>24))closeSheet();
    else{box.style.transform='';sh.style.background=''}
  };
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  grab.addEventListener('click',()=>{if(!dragged&&sh.classList.contains('open'))closeSheet()});
}
function confirmSheet(title,body,yes,onYes,no='Cancel'){
  openSheet(`<h4>${title}</h4><p>${body}</p><div class="dialfoot"><button class="btn" data-v="no">${no}</button><button class="btn danger" data-v="yes">${yes}</button></div>`,v=>{if(v==='yes')onYes()});
}

/* Hold-to-lift button that snaps to left or right side of its host */
function sideDraggable(btn,host,key,onTap){
  let timer=null,sx=0,sy=0,lifted=false,pid=null;
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('pointerdown',e=>{
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;lifted=false;
    try{btn.setPointerCapture(pid)}catch(_){}
    timer=setTimeout(()=>{lifted=true;timer=null;btn.classList.add('lifted');host.classList.add('dropping');buzz(15)},320);
  });
  btn.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    if(!lifted){if(timer&&timer!==-1&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){clearTimeout(timer);timer=-1}return}
    const r=host.getBoundingClientRect();
    btn.style.transition='scale .15s,box-shadow .15s';
    btn.style.left=Math.min(Math.max(e.clientX-r.left-28,8),r.width-64)+'px';
  });
  const end=(e,cancel)=>{
    if(e.pointerId!==pid)return;
    const tap=!cancel&&!lifted&&timer!==null&&timer!==-1;
    clearTimeout(timer);timer=null;pid=null;
    if(lifted){
      const r=host.getBoundingClientRect();
      const side=e.clientX-r.left<r.width/2?'left':'right';
      btn.dataset.side=side;S.ui[key]=side;save();
      btn.style.transition='';btn.style.left='';
      btn.classList.remove('lifted');host.classList.remove('dropping');buzz(8);
    }else if(tap)onTap();
  };
  btn.addEventListener('pointerup',e=>end(e,false));
  btn.addEventListener('pointercancel',e=>end(e,true));
  btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap()}});
}

/* ================= Recorder ================= */
function openRecorder(title,onDone){
  let stream=null,rec=null,chunks=[],blob=null,timer=null,t0=0,playH=null,an=null,src=null,raf=0,closed=false;
  const MAX=90;
  const html=`<h4>${esc(title)}</h4><div class="recbox">
    <div class="rectime num" id="recTime">0:00</div>
    <div class="recwave" id="recWave">${'<i></i>'.repeat(28)}</div>
    <button class="recbtn" data-keep="toggle" id="recBtn" aria-label="Start recording"><i></i></button>
    <div class="recstat" id="recStat">Tap to start recording (up to ${MAX} s)</div></div>
    <div class="dialfoot hidden" id="recFoot"><button class="btn" data-keep="play" id="recPlay">Play</button><button class="btn" data-keep="redo">Redo</button><button class="btn pri" data-v="use">Use recording</button></div>
    <div class="menu hidden" id="recAlt"><button data-v="sys">${ui('mic')}Use the device recorder</button><button data-v="file">${ui('upload')}Choose an audio file</button></div>`;
  const stopPlay=()=>{playH?.stop();playH=null;const b=$('#recPlay');if(b&&!closed)b.textContent='Play'};
  const stopAll=()=>{cancelAnimationFrame(raf);clearInterval(timer);try{src?.disconnect()}catch(e){}src=null;an=null;stream?.getTracks().forEach(t=>t.stop());stream=null;stopPlay()};
  const meter=()=>{
    if(!an||closed)return;
    const d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);
    let s=0;for(const v of d)s+=(v-128)**2;
    const lvl=Math.min(1,Math.sqrt(s/d.length)/40),bars=$$('#recWave i');
    bars.forEach((b,i)=>{const k=1-Math.abs(i-bars.length/2)/(bars.length/2);b.style.height=Math.max(3,lvl*38*(.4+.6*k)*(.7+.3*Math.random()))+'px'});
    raf=requestAnimationFrame(meter);
  };
  const stopRec=()=>{if(rec&&rec.state!=='inactive')rec.stop()};
  const unavailable=msg=>{
    if(closed)return;
    $('#recStat').textContent=msg;
    $('#recBtn').classList.add('hidden');$('#recWave').classList.add('hidden');$('#recTime').classList.add('hidden');$('#recAlt').classList.remove('hidden');
  };
  const start=async()=>{
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return unavailable('In-app recording isn’t supported in this browser.');
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
    catch(e){return unavailable('The microphone isn’t available here. This browser or page may be blocking it.')}
    if(closed){stopAll();return}
    const c=ensureAudio();
    if(c){try{an=c.createAnalyser();an.fftSize=512;src=c.createMediaStreamSource(stream);src.connect(an);meter()}catch(e){an=null}}
    const mime=pickMime(['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus']);
    try{rec=new MediaRecorder(stream,mime?{mimeType:mime}:{})}
    catch(e){stopAll();return unavailable('In-app recording isn’t supported in this browser.')}
    chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{
      blob=new Blob(chunks,{type:(rec.mimeType||mime||'audio/webm').split(';')[0]});
      stopAll();
      if(closed)return;
      $('#recBtn').classList.remove('on');$('#recBtn').setAttribute('aria-label','Start recording');
      if(!blob.size){blob=null;$('#recStat').textContent='Nothing was recorded. Try again.';return}
      $('#recBtn').classList.add('hidden');
      $('#recStat').textContent='Recorded. Play it back, then use it.';
      $('#recFoot').classList.remove('hidden');
    };
    rec.start(200);t0=Date.now();
    $('#recBtn').classList.add('on');$('#recBtn').setAttribute('aria-label','Stop recording');
    $('#recStat').textContent='Recording… tap to stop';
    timer=setInterval(()=>{const s=(Date.now()-t0)/1000;$('#recTime').textContent=fmt(s);if(s>=MAX)stopRec()},200);
  };
  openSheet(html,v=>{
    if(v==='use'&&blob)onDone(blob);
    if(v==='file')pickFile('audio/*',onDone);
    if(v==='sys'){$('#filePick').setAttribute('capture','user');pickFile('audio/*',onDone)}
  },{
    onKeep:v=>{
      if(v==='toggle'){rec&&rec.state==='recording'?stopRec():start()}
      if(v==='play'&&blob){
        if(playH){stopPlay();return}
        decodeBlob(blob).then(b=>{
          if(closed)return;
          if(!b)return toast('Playback isn’t supported for this recording, but you can still use it');
          playH=playBuffer(b);if(!playH)return;
          $('#recPlay').textContent='Stop';playH.onended=stopPlay;
        });
      }
      if(v==='redo'){
        stopPlay();blob=null;rec=null;
        $('#recFoot').classList.add('hidden');$('#recBtn').classList.remove('hidden');
        $('#recTime').textContent='0:00';$('#recStat').textContent='Tap to start recording';
        $$('#recWave i').forEach(b=>b.style.height='3px');
      }
    },
    onClose:()=>{closed=true;if(rec&&rec.state==='recording'){rec.onstop=null;rec.stop()}stopAll()}
  });
}

const CAM={stream:null,facing:'environment',mode:'image',rec:null,chunks:[],onDone:null,timer:null};

  camStopStream();$('#camErr').classList.add('hidden');$('#cam').classList.remove('err');
  try{

    CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.facing,width:{ideal:1280},height:{ideal:720}},audio:false});

function camFinish(blob,type){const cb=CAM.onDone;closeCamera();cb?.(blob,type)}
function camShoot(){
  const v=$('#camV');if(!CAM.stream||!v.videoWidth)return;
  if(CAM.mode==='image'){
    const k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement('canvas');c.width=v.videoWidth*k;c.height=v.videoHeight*k;
    const g=c.getContext('2d');if(CAM.facing==='user'){g.translate(c.width,0);g.scale(-1,1)}
    g.drawImage(v,0,0,c.width,c.height);buzz(20);
    c.toBlob(b=>b&&camFinish(b,'image'),'image/jpeg',.85);
    return;
  }
  if(CAM.rec&&CAM.rec.state==='recording'){CAM.rec.stop();return}
  if(!window.MediaRecorder){toast('Video recording is not supported here');return}
  const mime=pickMime(['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4']);
  const rec=new MediaRecorder(CAM.stream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:900000});
  CAM.rec=rec;CAM.chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)CAM.chunks.push(e.data)};
  rec.onstop=()=>{clearInterval(CAM.timer);camFinish(new Blob(CAM.chunks,{type:rec.mimeType||'video/webm'}),'video')};
  rec.start(250);const t0=Date.now();
  $('#camShot').classList.add('on');$('#camTime').textContent='0:00';
  CAM.timer=setInterval(()=>{const s=(Date.now()-t0)/1000;$('#camTime').textContent=fmt(s);if(s>=30)rec.stop()},250);
}

  $('#camClose').innerHTML=ui('close');$('#camFlip').innerHTML=ui('flip');
  $('#camClose').onclick=closeCamera;
  $('#camFlip').onclick=()=>{if(CAM.rec?.state==='recording')return;CAM.facing=CAM.facing==='user'?'environment':'user';camStart()};
  $('#camShot').onclick=camShoot;
  $('#camModes').onclick=e=>{const b=e.target.closest('[data-cm]');if(!b||CAM.rec?.state==='recording')return;CAM.mode=b.dataset.cm;camUI()};
  $('#camSys').onclick=()=>{$('#filePick').setAttribute('capture','environment');pickFile(CAM.mode==='video'?'video/*':'image/*',f=>camFinish(f,kindOf(f)))};

}

/* ================= Drawing ================= */
/* Strokes are kept as vectors so undo/redo can replay them. "bg" and "clear" are
   recorded as steps too, so they undo like any stroke.                            */
const DW={cb:null,strokes:[],redo:[],cur:null,tool:'pen',color:'#1a1d2e',size:16,bgImg:null,layer:null,frame:0};
const DW_COLORS=['#1a1d2e','#ffffff','#ff5c7a','#ff7a59','#ffd23f','#4dd9a6','#5aa9ff','#c98bff'];
async function openDraw(bgBlob,onDone){
  const cv=$('#drawCv');
  Object.assign(DW,{cb:onDone,strokes:[],redo:[],cur:null,bgImg:null});
  if(bgBlob){
    try{DW.bgImg=await createImageBitmap(bgBlob)}
    catch(e){try{DW.bgImg=await loadImg(URL.createObjectURL(bgBlob))}catch(_){toast('Could not open that image, starting blank')}}
  }
  DW.layer=document.createElement('canvas');DW.layer.width=cv.width;DW.layer.height=cv.height;
  document.body.classList.add('drawing');
  $('#draw').classList.remove('hidden');
  redrawAll();
}
function closeDraw(force){
  if(!force&&DW.strokes.length){confirmSheet('Discard this drawing?','What you drew will be lost.','Discard',()=>closeDraw(true),'Keep drawing');return}
  $('#draw').classList.add('hidden');document.body.classList.remove('drawing');
  Object.assign(DW,{cb:null,strokes:[],redo:[],cur:null,bgImg:null});
}
function drawBg(){let bg='#ffffff',img=DW.bgImg;for(const s of DW.strokes)if(s.tool==='bg'){bg=s.color;img=null}return{bg,img}}
function compose(){
  const cv=$('#drawCv'),g=cv.getContext('2d');if(!g)return;
  const {bg,img}=drawBg();
  g.globalCompositeOperation='source-over';g.fillStyle=bg;g.fillRect(0,0,cv.width,cv.height);
  if(img){const k=Math.max(cv.width/img.width,cv.height/img.height),w=img.width*k,h=img.height*k;g.drawImage(img,(cv.width-w)/2,(cv.height-h)/2,w,h)}
  g.drawImage(DW.layer,0,0);
}
function paint(s,from){
  const L=DW.layer.getContext('2d');if(!L)return;
  if(s.tool==='clear'){L.clearRect(0,0,DW.layer.width,DW.layer.height);return}
  if(s.tool==='bg')return;
  L.save();
  L.globalCompositeOperation=s.tool==='erase'?'destination-out':'source-over';
  L.strokeStyle=L.fillStyle=s.color;L.lineCap=L.lineJoin='round';
  const P=s.pts;
  if(from===0){L.beginPath();L.arc(P[0][0],P[0][1],s.size*(.5+.5*P[0][2])/2,0,TAU);L.fill()}
  for(let i=Math.max(1,from);i<P.length;i++){
    const a=P[i-1],b=P[i];
    L.lineWidth=s.size*(.5+.25*(a[2]+b[2]));
    L.beginPath();L.moveTo(a[0],a[1]);L.lineTo(b[0],b[1]);L.stroke();
  }
  L.restore();
}
function redrawAll(){
  const L=DW.layer.getContext('2d');
  L?.clearRect(0,0,DW.layer.width,DW.layer.height);
  DW.strokes.forEach(s=>paint(s,0));
  compose();drawToolsUI();
}
function queueCompose(){if(DW.frame)return;DW.frame=requestAnimationFrame(()=>{DW.frame=0;compose()})}
function drawToolsUI(){
  $$('#dwColors [data-col]').forEach(b=>b.classList.toggle('on',b.dataset.col===DW.color));
  $$('#dwSizes [data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===DW.size));
  $$('#dwTools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===DW.tool));
  $('#dwUndo').disabled=!DW.strokes.length;$('#dwRedo').disabled=!DW.redo.length;
  $('#dwClear').disabled=!DW.strokes.some(s=>s.tool==='pen'||s.tool==='erase');
}
function bindDraw(){
  $('#dwClose').innerHTML=ui('close');$('#dwUndo').innerHTML=ui('undo');$('#dwRedo').innerHTML=ui('redo');$('#dwClear').innerHTML=ui('trash');
  $('#dwColors').innerHTML=DW_COLORS.map(c=>`<button data-col="${c}" style="--sw:${c}" aria-label="Color ${c}"></button>`).join('')
    +`<label class="swpick" title="Custom color"><input type="color" id="dwPick" value="#1a1d2e" aria-label="Custom color"></label>`;
  $('#dwTools').innerHTML=`<button data-t="pen">${ui('pen','icon sm')}Pen</button><button data-t="erase">${ui('eraser','icon sm')}Eraser</button><button data-t="bg">${ui('fill','icon sm')}Fill</button>`;
  const cv=$('#drawCv');
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*cv.width,(e.clientY-r.top)/r.height*cv.height,e.pointerType==='pen'&&e.pressure>0?e.pressure:1]};
  cv.addEventListener('pointerdown',e=>{
    if(DW.cur||!DW.layer)return;
    e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    const s={tool:DW.tool==='erase'?'erase':'pen',color:DW.color,size:DW.size*(DW.tool==='erase'?1.8:1),pts:[pt(e)]};
    DW.cur={s,pid:e.pointerId};DW.strokes.push(s);DW.redo=[];
    paint(s,0);queueCompose();drawToolsUI();
  });
  cv.addEventListener('pointermove',e=>{
    const c=DW.cur;if(!c||e.pointerId!==c.pid)return;
    const n=c.s.pts.length;
    for(const ev of (e.getCoalescedEvents?.()||[e]))c.s.pts.push(pt(ev));
    paint(c.s,n);queueCompose();
  });
  const up=e=>{if(DW.cur&&e.pointerId===DW.cur.pid)DW.cur=null};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  $('#dwColors').onclick=e=>{const b=e.target.closest('[data-col]');if(!b)return;DW.color=b.dataset.col;if(DW.tool==='erase')DW.tool='pen';drawToolsUI()};
  $('#dwPick').oninput=e=>{DW.color=e.target.value;if(DW.tool==='erase')DW.tool='pen';drawToolsUI()};
  $('#dwSizes').onclick=e=>{const b=e.target.closest('[data-s]');if(b){DW.size=+b.dataset.s;drawToolsUI()}};
  $('#dwTools').onclick=e=>{
    const b=e.target.closest('[data-t]');if(!b)return;
    if(b.dataset.t==='bg'){DW.strokes.push({tool:'bg',color:DW.color});DW.redo=[];redrawAll();return}
    DW.tool=b.dataset.t;drawToolsUI();
  };
  $('#dwUndo').onclick=()=>{const s=DW.strokes.pop();if(s){DW.redo.push(s);redrawAll()}};
  $('#dwRedo').onclick=()=>{const s=DW.redo.pop();if(s){DW.strokes.push(s);redrawAll()}};
  $('#dwClear').onclick=()=>{DW.strokes.push({tool:'clear'});DW.redo=[];redrawAll()};
  $('#dwClose').onclick=()=>closeDraw();
  $('#dwUse').onclick=()=>{
    const cb=DW.cb;if(!cb)return;
    compose();
    const photo=!!drawBg().img;
    cv.toBlob(b=>{closeDraw(true);if(b)cb(b);else toast('Could not save the drawing')},photo?'image/jpeg':'image/png',.9);
  };
}
function drawKeys(e){
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();(e.shiftKey?$('#dwRedo'):$('#dwUndo')).click()}

/* ================= Make a sound ================= */
const waveIcon=k=>`<svg viewBox="0 0 34 18" aria-hidden="true"><path d="${({
  sine:'M1 9C5-1 9-1 13 9S21 19 25 9 33-1 33 9',triangle:'M1 9L7 2 19 16 31 2 33 4',
  square:'M1 15V3H9V15H17V3H25V15H33',sawtooth:'M1 15L11 3V15L21 3V15L31 3V15',
  noise:'M1 9L3 4 5 13 7 6 9 15 11 3 13 11 15 5 17 14 19 7 21 12 23 2 25 13 27 6 29 11 31 4 33 9'})[k]}"/></svg>`;
const SYN_F=[['freq','Pitch'],['dur','Length'],['a','Attack'],['d','Decay'],['s','Sustain'],['r','Release'],['vol','Volume']];
const SYN_R={freq:[0,1000,1],dur:[.05,3,.05],a:[0,1,.01],d:[0,1.5,.01],s:[0,1,.01],r:[0,2,.01],vol:[.05,1,.05]};
const synTo=(k,v)=>k==='freq'?Math.round(Math.log(v/40)/Math.log(100)*1000):v;
const synFrom=(k,x)=>k==='freq'?+(40*Math.pow(100,x/1000)).toFixed(1):+x;
const synShow=(k,v)=>k==='freq'?`${Math.round(v)} Hz`:k==='dur'?`${v.toFixed(2)} s`:k==='s'||k==='vol'?`${Math.round(v*100)}%`:`${Math.round(v*1000)} ms`;
function synthSheet(init,onUse,title='Make a sound'){
  const p={...DEF_SYN,...(init||{})};
  let h=null;
  const play=()=>{ensureAudio();h?.stop();h=null;synthBuffer({...p}).then(b=>{if(b)h=playBuffer(b)})};
  openSheet(`<h4>${esc(title)}</h4><div class="syn">
    <div class="waves" role="radiogroup" aria-label="Wave">${Object.entries(WAVES).map(([k,n])=>`<button data-keep="w:${k}" role="radio" aria-checked="${p.wave===k}" class="${p.wave===k?'on':''}">${waveIcon(k)}<span>${n}</span></button>`).join('')}</div>
    <svg class="envsvg" viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true"><path id="synEnv"/></svg>
    ${SYN_F.map(([k,n])=>`<label class="slrow"><span>${n}</span><input type="range" data-syn="${k}" min="${SYN_R[k][0]}" max="${SYN_R[k][1]}" step="${SYN_R[k][2]}" value="${synTo(k,p[k])}"><output id="syn_${k}">${synShow(k,p[k])}</output></label>`).join('')}
    <div class="dialfoot"><button class="btn" data-keep="play">Play</button><button class="btn pri" data-v="use">Use this sound</button></div></div>`,
  v=>{if(v==='use'){h?.stop();onUse({...p})}},{
    onKeep:(v,el)=>{
      if(v==='play')return play();
      if(v.startsWith('w:')){
        p.wave=v.slice(2);
        $$('.syn .waves button').forEach(b=>{b.classList.toggle('on',b===el);b.setAttribute('aria-checked',String(b===el))});
        env();play();
      }
    },
    onClose:()=>h?.stop()
  });
  function env(){
    const T=Math.max(.001,p.dur+p.r),X=t=>(t/T*296+2).toFixed(1),Y=v=>(66-v*60).toFixed(1);
    const A=Math.min(p.a,p.dur),Dd=Math.max(0,Math.min(p.d,p.dur-A)),hold=Dd>.001?p.s:1;
    $('#synEnv').setAttribute('d',`M${X(0)} ${Y(0)}L${X(A)} ${Y(1)}L${X(A+Dd)} ${Y(hold)}L${X(p.dur)} ${Y(hold)}L${X(T)} ${Y(0)}Z`);
    const f=$('.syn [data-syn="freq"]');f.disabled=p.wave==='noise';
  }
  $$('.syn [data-syn]').forEach(inp=>{
    const k=inp.dataset.syn;
    inp.addEventListener('input',()=>{p[k]=synFrom(k,inp.value);$('#syn_'+k).textContent=synShow(k,p[k]);env()});
    inp.addEventListener('change',play);
  });
  env();
}

/* ---------- Chart drawer: tucked at the bottom, pulls up over everything ---------- */
const peekPx=()=>$('#peekProbe').offsetHeight||92;
/* The middle stop is offered only where it leaves room for a real chart and a whole card. */
function drawerHeights(){
  const dash=$('#dash'),H=dash.clientHeight,top=$('#cards').getBoundingClientRect().top-dash.getBoundingClientRect().top;
  const land=matchMedia('(orientation:landscape) and (max-height:600px)').matches;
  const peek=peekPx(),half=Math.round(Math.min(land?H:H*.55,H-top-150));
  return{peek,half,full:H,snaps:half-peek>=120?['peek','half','full']:['peek','full']};
}
function setDrawer(snap,persist=true){
  const d=$('#drawer');
  if(!$('#dash').clientHeight){d.dataset.snap=snap;return}
  const hs=drawerHeights();
  if(!hs.snaps.includes(snap))snap=snap==='full'?'full':'peek';
  d.dataset.snap=snap;d.style.height=hs[snap]+'px';
  $('#dash').style.setProperty('--dh',(snap==='half'?hs.half:hs.peek)+'px');
  d.classList.toggle('full',snap==='full');
  const h=$('#drawerHandle');
  h.setAttribute('aria-expanded',String(snap!=='peek'));
  h.setAttribute('aria-label',snap==='peek'?'Show chart':snap==='half'?'Expand chart to full screen':'Collapse chart');
  $('#dashTop').inert=snap==='full';
  $('#dashFab').inert=snap!=='peek';
  if(persist&&S.ui.drawer!==snap){S.ui.drawer=snap;save()}
}
function cycleDrawer(){const {snaps}=drawerHeights();setDrawer(snaps[(snaps.indexOf($('#drawer').dataset.snap)+1)%snaps.length])}
function bindDrawer(){
  const d=$('#drawer'),handle=$('#drawerHandle');
  let st=null,dragged=false;
  const down=e=>{
    if(e.button>0||e.target.closest('#rng'))return;
    st={y:e.clientY,h:d.getBoundingClientRect().height,pid:e.pointerId,moved:false,v:0,ly:e.clientY,lt:performance.now(),el:e.currentTarget};
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
  };
  const move=e=>{
    if(!st||e.pointerId!==st.pid)return;
    const dy=e.clientY-st.y;
    if(!st.moved){if(Math.abs(dy)<6)return;st.moved=true;d.classList.add('dragging')}
    const hs=drawerHeights(),t=performance.now(),h=Math.max(hs.peek,Math.min(hs.full,st.h-dy));
    d.style.height=h+'px';d.classList.toggle('full',h>=hs.full-2);
    st.v=(e.clientY-st.ly)/Math.max(1,t-st.lt);st.ly=e.clientY;st.lt=t;
  };
  const up=e=>{
    if(!st||e.pointerId!==st.pid)return;
    const s=st;st=null;
    if(!s.moved){if(s.el!==handle)cycleDrawer();return}
    dragged=true;setTimeout(()=>{dragged=false},0);
    d.classList.remove('dragging');
    const hs=drawerHeights(),h=d.getBoundingClientRect().height;
    let snap;
    if(s.v<-.4)snap=hs.snaps.find(k=>hs[k]>h+10)||'full';
    else if(s.v>.4)snap=[...hs.snaps].reverse().find(k=>hs[k]<h-10)||'peek';
    else snap=hs.snaps.reduce((a,b)=>Math.abs(hs[b]-h)<Math.abs(hs[a]-h)?b:a);
    setDrawer(snap);
  };
  for(const el of [handle,$('#chartHead')]){
    el.addEventListener('pointerdown',down);el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  }
  handle.onclick=()=>{if(!dragged)cycleDrawer()};
  let rz=0;
  addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(screen==='dash')setDrawer(d.dataset.snap,false)},100)});
}

/* ---------- Charts (main history and archive) ---------- */
function niceStep(x){if(x<=0)return 1;const p=10**Math.floor(Math.log10(x)),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
/* range: d7/d14/d30 (days), w12 (weeks), m12 (months) */
function bucketsFor(range,skip=0){
  const kind=range[0],n=+range.slice(1),t=new Date();t.setHours(0,0,0,0);
  const out=[];
  for(let j=n-1;j>=0;j--){
    const i=j+skip;
    let d,k,lbl,long;
    if(kind==='d'){
      d=new Date(t);d.setDate(d.getDate()-i);k=dayKey(d);
      lbl=n<=7?'SMTWTFS'[d.getDay()]:(j%(n<=14?2:5)===0?String(d.getDate()):'');
      long=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
    }else if(kind==='w'){
      d=new Date(t);d.setDate(d.getDate()-d.getDay()-7*i);k='w'+dayKey(d);
      lbl=j%3===0?`${d.getMonth()+1}/${d.getDate()}`:'';
      long=`Week of ${d.toLocaleDateString([],{month:'short',day:'numeric'})}`;
    }else{
      d=new Date(t.getFullYear(),t.getMonth()-i,1);k=`m${d.getFullYear()}-${d.getMonth()}`;
      lbl=d.toLocaleDateString([],{month:'narrow'});
      long=d.toLocaleDateString([],{month:'long',year:'numeric'});
    }
    out.push({d,k,lbl,long,by:{},sum:0});
  }
  return out;
}
function bucketKey(date,range){
  if(range[0]==='d')return date;
  const [y,m,dd]=date.split('-').map(Number),d=new Date(y,m-1,dd);
  if(range[0]==='w'){d.setDate(d.getDate()-d.getDay());return 'w'+dayKey(d)}
  return `m${d.getFullYear()}-${d.getMonth()}`;
}
/* Stacked bars per bucket, with dashed averages per workout and for the total.
   Hidden workouts drop out of the bars, the scale, the averages and the total. */
/* Bucket key for a Date (the entry-string version is bucketKey). */
function bucketKeyOf(d,range){
  const x=new Date(d);x.setHours(0,0,0,0);
  if(range[0]==='d')return dayKey(x);
  if(range[0]==='w'){x.setDate(x.getDate()-x.getDay());return 'w'+dayKey(x)}
  return `m${x.getFullYear()}-${x.getMonth()}`;
}
function bucketStartOf(d,range){
  const x=new Date(d);x.setHours(0,0,0,0);
  if(range[0]==='w')x.setDate(x.getDate()-x.getDay());
  if(range[0]==='m')x.setDate(1);
  return x;
}
/* Stacked bars per bucket, with trailing moving averages per workout and for the
   total. The window slider runs from one bucket (the values themselves) up to
   everything ever recorded. Hidden workouts drop out of every part of this. */
function drawChart(o){
  const el=o.el,W=el.clientWidth,H=el.clientHeight,hid=new Set(o.hidden||[]),skip=Math.max(0,o.off||0);
  const B=bucketsFor(o.range,skip),N=B.length,byKey={},rangeTot={};
  let firstD=null;
  for(const e of o.entries){
    const k=bucketKey(e.date,o.range);
    (byKey[e.workoutId]??={})[k]=(byKey[e.workoutId][k]||0)+e.seconds;
    const d=new Date(e.date+'T00:00:00');
    if(!isNaN(d)&&(!firstD||d<firstD))firstD=d;
  }
  for(const b of B){
    b.by={};b.sum=0;
    for(const id of Object.keys(byKey)){
      const v=byKey[id][b.k]||0;
      if(v){b.by[id]=v;rangeTot[id]=(rangeTot[id]||0)+v;if(!hid.has(id))b.sum+=v}
    }
  }
  const maxS=Math.max(0,...B.map(b=>b.sum)),sumS=B.reduce((a,b)=>a+b.sum,0);
  const unit=maxS>3*3600?'h':'m',div=unit==='h'?3600:60;
  o.info.textContent=(skip?`${B[0].long} – ${B.at(-1).long}`:o.label(unit))+(sumS?` · ${fmt(sumS)} total · ${fmt(Math.round(sumS/N))} avg`:'');
  const rank=id=>{const k=S.workouts.findIndex(w=>w.id===id);return k<0?1e9:k};
  const ids=Object.keys(rangeTot).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
  const meta=Object.fromEntries(ids.map(id=>[id,o.lookup(id)]));
  const sl=o.legend.scrollLeft;
  o.legend.innerHTML=ids.map(id=>`<button class="lg ${hid.has(id)?'off':''}" data-lg="${esc(id)}" style="--c:${meta[id].c}" aria-pressed="${!hid.has(id)}"><i></i>${esc(meta[id].n)}</button>`).join('')
    +(ids.length?`<button class="lg avgbtn ${o.avg?'':'off'}" data-lg="__avg" aria-pressed="${!!o.avg}"><i></i>Averages</button>`:'');
  o.legend.scrollLeft=sl;
  o.legend.onclick=e=>{const b=e.target.closest('[data-lg]');if(b)o.toggle(b.dataset.lg)};
  const showAvg=!!o.avg&&!!ids.length;
  // Every bucket from the first record (or the start of the view) to now, for the window.
  const seq=[];
  {
    const step=o.range[0],end=B.at(-1).d;
    let d=bucketStartOf(firstD&&firstD<B[0].d?firstD:B[0].d,o.range),guard=0;
    while(d<=end&&guard++<4000){
      seq.push(bucketKeyOf(d,o.range));
      if(step==='d')d.setDate(d.getDate()+1);else if(step==='w')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1);
    }
  }
  const idxOf=new Map(seq.map((k,j)=>[k,j]));
  const cumOf=series=>{const c=[0];for(let j=0;j<seq.length;j++)c.push(c[j]+(series[seq[j]]||0));return c};
  const mean=(c,j,w)=>{const ww=Math.min(w,j+1);return (c[j+1]-c[j+1-ww])/ww};
  // The slider reaches twice the view before the last stop, which is all time.
  const maxWin=2*N,maxPos=maxWin+1,pos=(!o.win||o.win>maxWin)?maxPos:Math.max(1,o.win),win=pos===maxPos?Math.max(seq.length,1):pos;
  // The far right is the average across everything recorded: one flat line.
  const meanAt=(c,j)=>pos===maxPos?c.at(-1)/Math.max(1,seq.length):mean(c,j,win);
  const per={d:'day',w:'week',m:'month'}[o.range[0]];
  if(o.row){
    const need=showAvg||skip>0;
    o.row.classList.toggle('hidden',!need);
    const key=`${showAvg?maxPos:0}|${skip>0?1:0}`;
    if(need&&o.row.dataset.key!==key){
      o.row.dataset.key=key;
      o.row.innerHTML=(skip>0?`<button class="chip now">Now</button>`:'')
        +(showAvg?`<input type="range" min="1" max="${maxPos}" step="1" value="${pos}" aria-label="Averaging window"><span class="wlab"></span>`:'');
      const nb=o.row.querySelector('.now');if(nb)nb.onclick=()=>o.onPan?.(0);
      const ip=o.row.querySelector('input');if(ip)ip.oninput=()=>o.onWin?.(+ip.value===maxPos?0:+ip.value);
    }
    if(need&&showAvg){
      const inp=o.row.querySelector('input');
      if(document.activeElement!==inp&&+inp.value!==pos)inp.value=String(pos);
      o.row.querySelector('.wlab').textContent=pos===maxPos?'all time':pos===1?`each ${per}`:`${pos} ${per}s`;
    }
  }
  // Drag the chart sideways to walk back through time.
  const stepMs={d:864e5,w:6048e5}[o.range[0]];
  const maxOff=(()=>{
    if(!firstD)return 0;
    const a=bucketStartOf(firstD,o.range),b=bucketStartOf(new Date(),o.range);
    const n=stepMs?Math.round((b-a)/stepMs):(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
    return Math.max(0,n-Math.floor(N/2));
  })();
  const panStep=Math.max(8,(W-38)/N);
  el.style.touchAction='pan-y';
  el.onpointerdown=e=>{
    if(e.button>0||!maxOff)return;
    el._pan={x:e.clientX,base:skip,moved:false,pid:e.pointerId};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  };
  el.onpointermove=e=>{
    const p=el._pan;if(!p||e.pointerId!==p.pid)return;
    const dx=e.clientX-p.x;   // the chart follows your finger: drag right to go back in time
    if(!p.moved){if(Math.abs(dx)<8)return;p.moved=true}
    const next=Math.max(0,Math.min(maxOff,p.base+Math.round(dx/panStep)));
    if(next!==skip)o.onPan?.(next);
  };
  el.onpointerup=el.onpointercancel=()=>{const p=el._pan;el._pan=null;if(p?.moved)el._panned=Date.now()};
  el.onclick=null;
  if(W<60||H<60){el.innerHTML='';return}
  if(!maxS){
    el.innerHTML=ids.length?`<div class="cempty"><div>${ids.every(id=>hid.has(id))?'Every workout is hidden. Tap a name below to bring it back.':'Nothing in this period.'}</div></div>`:o.empty();
    o.afterEmpty?.();return;
  }
  const maxU=maxS/div,step=niceStep(maxU/3),top=Math.ceil(maxU/step)*step;
  const ml=34,mr=showAvg?40:4,mt=8,mb=22,cw=W-ml-mr,ch=H-mt-mb,bw=cw/N,barW=Math.min(26,bw*.62);
  const Y=v=>mt+ch-(Math.max(0,Math.min(v,top))/top)*ch;
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="Stacked bar chart of training time">`;
  for(let v=0;v<=top+1e-9;v+=step){
    const y=Y(v);
    s+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="yl" x="${ml-6}" y="${y+4}" text-anchor="end">${+v.toFixed(1)}${unit}</text>`;
  }
  s+=`<rect class="sel" x="0" y="${mt}" width="${bw}" height="${ch}" rx="6" opacity="0"/>`;
  B.forEach((b,i)=>{
    const x=ml+i*bw+(bw-barW)/2;let y=mt+ch;
    Object.keys(b.by).filter(id=>!hid.has(id)).sort((p,q)=>rank(p)-rank(q)||p.localeCompare(q)).forEach(id=>{
      const h=b.by[id]/div/top*ch;y-=h;
      s+=`<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h-2,1)}" rx="3" fill="${meta[id].c}"/>`;
    });
    s+=`<text class="xl ${i===N-1&&!skip?'today':''}" x="${ml+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${b.lbl}</text>`;
    s+=`<rect data-i="${i}" x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ch+mb}" fill="transparent"/>`;
  });
  if(showAvg){
    const vis=ids.filter(id=>!hid.has(id)&&rangeTot[id]);
    const cums={};
    for(const id of vis)cums[id]=cumOf(byKey[id]);
    const totSeries={};
    for(const id of vis)for(const k of Object.keys(byKey[id]))totSeries[k]=(totSeries[k]||0)+byKey[id][k];
    const series=vis.length>1?vis.map(id=>({c:meta[id].c,cls:'avg',cum:cums[id]})):[];
    if(vis.length)series.push({c:vis.length===1?meta[vis[0]].c:'var(--tx)',cls:vis.length===1?'avg':'avg tot',cum:vis.length===1?cums[vis[0]]:cumOf(totSeries)});
    const drawn=series.map(sr=>{
      const pts=B.map((b,i)=>{
        const j=idxOf.get(b.k);
        return [ml+i*bw+bw/2,Y((j==null?0:meanAt(sr.cum,j))/div)];
      });
      return {...sr,pts,last:pts.at(-1),v:(()=>{const j=idxOf.get(B.at(-1).k);return (j==null?0:meanAt(sr.cum,j))/div})()};
    });
    for(const sr of drawn)s+=`<polyline class="${sr.cls}" points="${sr.pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" style="stroke:${sr.c}"/>`;
    const lab=drawn.map(sr=>({c:sr.c,v:sr.v,y:sr.last[1]})).sort((a,b)=>a.y-b.y);
    let prev=-1e9;
    for(const l of lab){l.ly=Math.max(l.y,prev+11);prev=l.ly}
    const over=lab.length?lab.at(-1).ly-(mt+ch+6):0;
    if(over>0)for(const l of lab)l.ly-=over;
    for(const l of lab)s+=`<text class="al" x="${W-mr+4}" y="${(l.ly+3.5).toFixed(1)}" style="fill:${l.c}">${l.v>=10?Math.round(l.v):+l.v.toFixed(1)}${unit}</text>`;
  }
  el.innerHTML=s+'</svg>';
  el.onclick=e=>{
    if(el._panned&&Date.now()-el._panned<300)return;
    const r=e.target.closest('[data-i]');if(!r)return;
    const i=+r.dataset.i,b=B[i],sel=el.querySelector('.sel');
    sel.setAttribute('x',ml+i*bw);sel.setAttribute('opacity','1');
    const n=Object.keys(b.by).filter(id=>!hid.has(id)).length;
    o.info.textContent=b.sum?`${b.long}: ${fmt(b.sum)} across ${plural(n,'workout')}`:`${b.long}: no training`;
  };
}
const toggleHidden=(list,id)=>{const i=list.indexOf(id);if(i<0)list.push(id);else list.splice(i,1)};
function renderMainChart(){

/* ---------- Start at a time / sync / schedule (one sheet) ----------
   The user sets when the workout (or one interval) starts or ends; whichever they
   edited last is kept and the other follows. */
const REPEATS=[['none','Once'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly']];
const TMODES=[['fit','Fit to the time'],['jump','Jump ahead']];
/* Scope, a round clock for the time, and what to do when that time has passed. */
function timingSheet({wid=null,run=null}){
  const w=run?workoutOf(run):S.workouts.find(x=>x.id===wid);
  if(!w||!total(w))return;
  const active=!!run&&!!run.w&&isLive(run),creating=!run,T=total(w)*1000;
  const st={scope:run?.plan?.scope??-1,edge:run?.plan?.edge||'start',repeat:run?.plan?.repeat||'none',
    mode:run?.plan?.mode||'fit',anchor:run?anchorOf(run):Math.ceil(Date.now()/60000)*60000};
  if(active&&run.pausedAt)st.anchor=Date.now()-elapsedOf(run);
  if(st.scope>=w.intervals.length)st.scope=-1;
  let phase='h',lastPhase=null;
  const off=()=>st.scope>=0?offsetMs(w,st.scope):0;
  const dur=()=>st.scope>=0?w.intervals[st.scope].duration*1000:T;
  const startOf=()=>st.anchor+off(),endOf=()=>startOf()+dur();
  const pinned=()=>st.edge==='start'?startOf():endOf();
  const setPinned=ms=>{st.anchor=st.edge==='start'?ms-off():ms-off()-dur()};
  const showRepeat=!active&&!(run&&run.anchor!=null);
  openSheet(`<h4>${creating?'Start at a time':active?'Sync to the clock':'Change start time'}</h4>
    <p class="small">${active?'Line this workout up with the clock. Set a start or an end and the other follows.':'Set when the workout, or one interval, starts or ends.'}</p>
    <select class="tsel" id="tScope" aria-label="What to line up">
      <option value="-1">Whole workout (${fmt(T/1000)})</option>
      ${w.intervals.map((it,i)=>`<option value="${i}">Interval ${i+1}: ${esc(it.title||'Untitled')} (${fmt(it.duration)})</option>`).join('')}
    </select>
    <div class="seg3" id="tEdge"><button data-keep="ed:start">Starts at</button><button data-keep="ed:end">Ends at</button></div>
    <div class="tpick">
      <div class="tdigits">
        <button class="td" data-keep="ph:h" id="tHH" aria-label="Set the hour">12</button><span>:</span><button class="td" data-keep="ph:m" id="tMM" aria-label="Set the minutes">00</button>
        <div class="tmer"><button data-keep="mer:am" id="tAM">AM</button><button data-keep="mer:pm" id="tPM">PM</button></div>
      </div>
      <div class="cface" id="tFace" role="slider" tabindex="0" aria-label="Clock face"><div class="chand" id="tHand"><i></i></div><div class="cnums" id="tNums"></div></div>
    </div>
    <div class="trow2"><input type="date" id="tDate" aria-label="Date"><span class="tother" id="tOther"></span></div>
    <div class="tquick"><button class="chip" data-keep="now">Now</button><button class="chip" data-keep="round">Round to :00 / :30</button><button class="chip" data-keep="p5">+5 min</button></div>
    <div class="sect">If that time has already begun</div>
    <div class="seg3" id="tMode">${TMODES.map(([k,n])=>`<button data-keep="mo:${k}">${n}</button>`).join('')}</div>
    <p class="small" id="tModeNote"></p>
    ${showRepeat?`<div class="sect">Repeat</div><div class="seg3" id="tRep">${REPEATS.map(([k,n])=>`<button data-keep="rep:${k}">${n}</button>`).join('')}</div>`:''}
    <p class="tprev" id="tPrev" aria-live="polite"></p>
    <div class="dialfoot"><button class="btn" data-v="cancel">Cancel</button><button class="btn pri" data-v="apply" id="tApply"></button></div>`,
  v=>{
    if(v!=='apply')return;
    const plan={edge:st.edge,scope:st.scope,at:pinned(),repeat:showRepeat?st.repeat:'none',mode:st.mode};
    if(creating)planRun(w.id,plan);
    else if(active)syncRun(run,plan);
    else updatePlan(run,plan);
  },{
    onKeep:v=>{
      if(v.startsWith('ed:')){st.edge=v.slice(3);phase='h'}
      else if(v.startsWith('ph:'))phase=v.slice(3);
      else if(v.startsWith('mer:')){
        const pm=v==='mer:pm',h=new Date(pinned()).getHours();
        if(pm!==(h>=12))setPinned(pinned()+(pm?1:-1)*12*3600e3);
      }
      else if(v.startsWith('mo:'))st.mode=v.slice(3);
      else if(v.startsWith('rep:'))st.repeat=v.slice(4);
      else if(v==='now'){st.edge='start';st.anchor=Date.now()-off()}
      else if(v==='p5')st.anchor+=5*60000;
      else if(v==='round')setPinned(Math.round(pinned()/18e5)*18e5);
      else return;
      fill();
    },
    onClose:()=>clearInterval(timer)
  });
  const sel=$('#tScope');sel.value=String(st.scope);
  sel.addEventListener('change',()=>{st.scope=+sel.value;fill()});
  $('#tDate').addEventListener('change',()=>{
    const t=parseDT($('#tDate').value,timeVal(pinned()));
    if(t!=null)setPinned(t);
    fill();
  });
  const face=$('#tFace');
  const fromAngle=e=>{
    const r=face.getBoundingClientRect();
    let deg=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90;
    if(deg<0)deg+=360;
    const d=new Date(pinned());
    if(phase==='h')d.setHours(d.getHours()>=12?(Math.round(deg/30)%12)+12:Math.round(deg/30)%12);
    else d.setMinutes(Math.round(deg/6)%60);
    d.setSeconds(0,0);
    setPinned(d.getTime());fill();
  };
  face.addEventListener('pointerdown',e=>{try{face.setPointerCapture(e.pointerId)}catch(_){}face.dataset.drag='1';fromAngle(e)});
  face.addEventListener('pointermove',e=>{if(face.dataset.drag)fromAngle(e)});
  const endDrag=()=>{if(face.dataset.drag){delete face.dataset.drag;if(phase==='h'){phase='m';fill()}}};
  face.addEventListener('pointerup',endDrag);face.addEventListener('pointercancel',endDrag);
  face.addEventListener('keydown',e=>{
    const d={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key];if(!d)return;
    e.preventDefault();
    setPinned(pinned()+d*(phase==='h'?3600e3:60e3));fill();
  });
  function fill(){
    const p=pinned(),d=new Date(p),h=d.getHours(),m=d.getMinutes(),pm=h>=12,h12=h%12||12;
    $('#tHH').textContent=String(h12);$('#tMM').textContent=pad2(m);
    $('#tHH').classList.toggle('on',phase==='h');$('#tMM').classList.toggle('on',phase==='m');
    $('#tAM').classList.toggle('on',!pm);$('#tPM').classList.toggle('on',pm);
    $$('#tEdge button').forEach(b=>b.classList.toggle('on',b.dataset.keep==='ed:'+st.edge));
    $$('#tMode button').forEach(b=>b.classList.toggle('on',b.dataset.keep==='mo:'+st.mode));
    $$('#tRep button').forEach(b=>b.classList.toggle('on',b.dataset.keep==='rep:'+st.repeat));
    if(lastPhase!==phase){
      lastPhase=phase;
      $('#tNums').innerHTML=Array.from({length:12},(_,i)=>{
        const val=phase==='h'?(i===0?12:i):i*5,a=(i*30-90)*Math.PI/180;
        return `<span style="left:${(50+36*Math.cos(a)).toFixed(2)}%;top:${(50+36*Math.sin(a)).toFixed(2)}%">${phase==='h'?val:pad2(val)}</span>`;
      }).join('');
    }
    const sel2=phase==='h'?h12%12:Math.round(m/5)%12,exact=phase==='h'||m%5===0;
    $$('#tNums span').forEach((s,i)=>s.classList.toggle('on',exact&&i===sel2));
    $('#tHand').style.setProperty('--a',(phase==='h'?(h12%12)*30:m*6)+'deg');
    face.setAttribute('aria-valuetext',clockTime(p));
    $('#tDate').value=dateVal(p);
    $('#tOther').textContent=st.edge==='start'?`Ends ${clockTime(endOf())}`:`Starts ${clockTime(startOf())}`;
    preview();
  }
  function preview(){
    const el=$('#tPrev'),btn=$('#tApply'),note=$('#tModeNote');if(!el)return;
    const now=Date.now(),a=st.anchor,late=now-a,endAt=a+T,fitting=st.mode==='fit';
    let ok=true,txt;
    if(late<=0)txt=`Waits ${untilLabel(-late)}, then runs from ${whenLabel(a)} to ${clockTime(endAt)} at full length.`;
    else if(endAt-now<5000){ok=false;txt='That window has already passed. Pick a later time.'}
    else if(fitting){
      const base=active?T-Math.max(0,elapsedOf(run)):T,avail=endAt-now;
      txt=`${active?'Rescales what is left':'Starts now'} to finish at ${clockTime(endAt)} — every interval at ${Math.round(avail/base*100)}% of its length (${fmt(base/1000)} of work into ${fmt(avail/1000)}).`;
    }else{
      const q=posAt(w,late),nm=w.intervals[q.idx]?.title||'Untitled';
      txt=`Picks up ${fmt(late/1000)} in, ${q.seg.kind==='tr'?`during the transition before interval ${q.idx+1}`:`at interval ${q.idx+1} (${nm})`}, and ends at ${clockTime(endAt)}.`;
    }
    el.textContent=txt;el.classList.toggle('bad',!ok);
    btn.disabled=!ok;
    btn.textContent=active?'Sync':creating?(late<=0?'Schedule':'Start'):'Save';
    $('#tMode').classList.toggle('dim',late<=0);
    if(note)note.textContent=late<=0?'Only matters once that time has passed.':fitting?'Interval lengths are scaled for this run only.':'Interval lengths stay as they are.';
  }
  fill();
  const timer=setInterval(()=>{if($('#tPrev'))preview();else clearInterval(timer)},1000);
}
