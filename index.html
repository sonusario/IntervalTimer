    s[k]=!s[k];el.setAttribute('aria-checked',String(s[k]));save();
    if(k==='haptics'&&s.haptics)buzz(20);
    if(k==='wake'){if(s.wake&&runs.some(r=>r.w&&!r.done))requestWake();else releaseWake()}
    return;
  }
  if(k==='trans')return globalTransSheet();
  if(k==='persist')return Store.persist().then(ok=>{toast(ok?'This browser will keep your data':'The browser didn’t allow that here');storageNote()});
  if(k==='delArchive')return confirmSheet('Delete archive data?',`Removes ${plural(S.archive.length,'archived session')} from deleted workouts. This can’t be undone.`,'Delete archive',()=>{S.archive=[];save();renderSettings();toast('Archive deleted')});
  if(k==='delHistory')return confirmSheet('Delete all workout history?',`Clears ${plural(S.history.length,'session')} from the main chart. Workouts and the archive stay. This can’t be undone.`,'Delete history',()=>{S.history=[];save();renderSettings();toast('History deleted')});
  if(k==='delWorkouts')return confirmSheet('Delete all workouts?',`Removes ${plural(S.workouts.length,'workout')} and their media. Their training moves to the archive, and scheduled starts are cancelled. Workouts already running finish normally.`,'Delete workouts',()=>{deleteWorkouts(S.workouts.map(w=>w.id));renderSettings();toast('All workouts deleted')});
  if(k==='export')return exportBackup();
  if(k==='import')return importBackup();
}
/* ---------- Transitions ---------- */
const stepSec=(v,d)=>Math.max(0,Math.min(900,v+d*(d>0?(v<20?1:v<60?5:15):(v<=20?1:v<=60?5:15))));
const stepperHTML=(p,v)=>`<div class="stepper"><button data-keep="${p}-" aria-label="Shorter">${ui('minus')}</button><output class="num">${v?fmtS(v):'Off'}</output><button data-keep="${p}+" aria-label="Longer">${ui('plus')}</button></div>`;
const TPRESETS=[0,3,5,10,15,30];
function transSheet(){
  const w=E.w;
  const lbl=which=>w.cues?.[which]?cueLabel(w.cues[which]):`Default: ${cueLabel(S.settings.cues[which])}`;
  const body=()=>{
    const cur=w.trans,d=S.settings.trans;
    return `<h4>Transitions</h4>
    <p>A pause between intervals that isn’t a card of its own. Tap the gap between two cards to change just that one, or to add time before the first or after the last interval.</p>
    <div class="sect">Between intervals</div>
    <div class="tchips"><button class="chip ${cur==null?'on':''}" data-keep="t:def">Default: ${d?fmtS(d):'off'}</button>${TPRESETS.map(s=>`<button class="chip ${cur===s?'on':''}" data-keep="t:${s}">${s?fmtS(s):'Off'}</button>`).join('')}</div>
    ${stepperHTML('st',transOf(w))}
    <div class="sect">Sounds</div>
    <div class="menu">
      <button data-v="tstart">${ui('play','icon fill')}Transition starts<span class="val">${esc(lbl('tstart'))}</span></button>
      <button data-v="tend">${ui('next','icon fill')}Transition ends<span class="val">${esc(lbl('tend'))}</span></button>
    </div>
    <p class="small">With 3-2-1 beeps on, they count you into each interval.</p>
    <div class="dialfoot"><button class="btn pri" data-v="done">Done</button></div>`;
  };
  openSheet(body(),v=>{
    if(v==='tstart'||v==='tend')setTimeout(()=>cueSheet({scope:'workout',w,it:null,which:v},()=>setTimeout(transSheet,300)),0);
  },{onKeep:v=>{
    if(v==='st-'||v==='st+')w.trans=stepSec(transOf(w),v==='st+'?1:-1);
    else if(v==='t:def')delete w.trans;
    else if(v.startsWith('t:'))w.trans=+v.slice(2);
    else return;
    renderEditor();$('#sheetBody').innerHTML=body();
  }});
}
/* One gap: time after the card above plus time before the card below. */
function gapSheet(k){
  const w=E.w,iv=w.intervals,n=iv.length,A=iv[k-1],B=iv[k],edge=k===0||k===n;
  const nm=(it,i)=>`“${it.title||`Interval ${i+1}`}”`;
  const row=(it,key,label)=>{
    const v=it[key],mode=v==null?'def':v===0?'none':'set',p=`m:${it.id}:${key}:`;
    return `<div class="mrow"><div class="mlab">${esc(label)}</div>
      <div class="seg3">${edge?'':`<button data-keep="${p}def" class="${mode==='def'?'on':''}">Default</button>`}<button data-keep="${p}none" class="${mode==='none'||(edge&&mode==='def')?'on':''}">None</button><button data-keep="${p}set" class="${mode==='set'?'on':''}">Set time</button></div>
      ${mode==='set'?`<div class="mset"><div class="tchips">${[3,5,10,15,30].map(s=>`<button class="chip ${v===s?'on':''}" data-keep="${p}=${s}">${fmtS(s)}</button>`).join('')}</div>${stepperHTML(p,v)}</div>`:''}
    </div>`;
  };
  const body=()=>{
    const g=gapAt(w,k),def=A&&B&&A.post==null&&B.pre==null;
    const title=k===0?'Before the first interval':k===n?'After the last interval':'Transition';
    const expl=k===0?(g?`${fmtS(g)} to get ready before ${nm(B,0)}.`:`Nothing before ${nm(B,0)}.`)
      :k===n?(g?`${fmtS(g)} after ${nm(A,k-1)}, then the workout ends.`:`The workout ends right after ${nm(A,k-1)}.`)
      :(g?`${fmtS(g)} between ${nm(A,k-1)} and ${nm(B,k)}${def?', from the workout default':''}.`:`No pause between ${nm(A,k-1)} and ${nm(B,k)}.`);
    return `<h4>${title}</h4><p>${esc(expl)}</p>
      ${A?row(A,'post',`After ${nm(A,k-1)}`):''}
      ${B?row(B,'pre',`Before ${nm(B,k)}`):''}
      ${edge?'':`<p class="small">Default uses the workout’s transition (${transOf(w)?fmtS(transOf(w)):'off'}) when neither side sets a time. Times set on both sides add up.</p>`}
      <div class="dialfoot"><button class="btn pri" data-v="done">Done</button></div>`;
  };
  openSheet(body(),null,{onKeep:v=>{
    const m=/^m:([^:]+):(pre|post):(.*)$/.exec(v);if(!m)return;
    const it=iv.find(x=>x.id===m[1]);if(!it)return;
    const key=m[2],op=m[3];
    if(op==='def')delete it[key];
    else if(op==='none'){if(edge)delete it[key];else it[key]=0}
    else if(op==='set')it[key]=it[key]>0?it[key]:(gapAt(w,k)||transOf(w)||5);
    else if(op[0]==='=')it[key]=+op.slice(1);
    else if(op==='-'||op==='+')it[key]=Math.max(1,stepSec(it[key]||0,op==='+'?1:-1));
    renderEditor();$('#sheetBody').innerHTML=body();
  }});
}
function globalTransSheet(){
  const body=()=>`<h4>Default transition</h4>
    <p>Time between intervals for workouts that don’t set their own.</p>
    <div class="tchips">${TPRESETS.map(s=>`<button class="chip ${S.settings.trans===s?'on':''}" data-keep="g:${s}">${s?fmtS(s):'Off'}</button>`).join('')}</div>
    ${stepperHTML('gs',S.settings.trans)}
    <div class="dialfoot"><button class="btn pri" data-v="done">Done</button></div>`;
  openSheet(body(),null,{onKeep:v=>{
    if(v==='gs-'||v==='gs+')S.settings.trans=stepSec(S.settings.trans,v==='gs+'?1:-1);
    else if(v.startsWith('g:'))S.settings.trans=+v.slice(2);
    else return;
    save();$('#sheetBody').innerHTML=body();
  },onClose:()=>{if(screen==='settings')renderSettings()}});
}

/* ---------- Colors ---------- */
function hexToHsv(hex){
  const n=parseInt(String(hex).slice(1),16)||0,r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  return{h,s:mx?d/mx:0,v:mx};
}
function hsvToHex({h,s,v}){
  const f=k=>{const x=(k+h/60)%6;return v-v*s*Math.max(0,Math.min(x,4-x,1))};
  return '#'+[f(5),f(3),f(1)].map(c=>Math.round(c*255).toString(16).padStart(2,'0')).join('').toUpperCase();
}
/* Palette swatches, a full picker, and an optional second color for theming. */
function colorSheet(tab='main'){
  const w=E.w;
  const cur=()=>tab==='main'?w.color:(w.color2||null);
  let hsv=hexToHsv(cur()||w.color);
  const body=()=>`<h4>Workout colors</h4>
    <div class="seg3"><button data-keep="tab:main" class="${tab==='main'?'on':''}" aria-pressed="${tab==='main'}">Main color</button><button data-keep="tab:acc" class="${tab==='acc'?'on':''}" aria-pressed="${tab==='acc'}">Accent color</button></div>
    <p class="small">${tab==='main'?'Used for the chart, buttons and progress.':'An optional second color for backgrounds, transitions and the progress trail.'}</p>
    <div class="swatches cswatch">${tab==='acc'?`<button data-keep="sw:none" class="none" aria-label="No accent color">${ui('off','icon sm')}</button>`:''}${PALETTE.map(c=>`<button data-keep="sw:${c}" style="--sw:${c}" aria-label="Color ${c}"></button>`).join('')}</div>
    <div class="cpick">
      <div class="sv" id="cpSV" role="slider" tabindex="0" aria-label="Saturation and brightness, use arrow keys"><i id="cpDot"></i></div>
      <input type="range" class="hue" id="cpHue" min="0" max="359" step="1" aria-label="Hue">
      <div class="cprow"><span class="cpprev" id="cpPrev"></span><input id="cpHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color"><div class="cdemo" id="cpDemo"><i></i><span>${esc(w.name||'Workout')}</span></div></div>
    </div>
    <div class="dialfoot"><button class="btn pri" data-v="done">Done</button></div>`;
  const set=(hex,live)=>{
    if(tab==='main')w.color=hex;else if(hex)w.color2=hex;else delete w.color2;
    if(live)setTheme($('#editor'),w);else renderEditor();
    paint();
  };
  const paint=()=>{
    const sv=$('#cpSV');if(!sv)return;
    const hex=hsvToHex(hsv),c=cur();
    sv.style.setProperty('--h',Math.round(hsv.h));
    $('#cpDot').style.left=`${hsv.s*100}%`;$('#cpDot').style.top=`${(1-hsv.v)*100}%`;
    $('#cpHue').value=String(Math.round(hsv.h));
    const hx=$('#cpHex');
    if(document.activeElement!==hx)hx.value=c||'';
    hx.placeholder=tab==='acc'?'None':hex;
    $('#cpPrev').style.background=c||'';$('#cpPrev').classList.toggle('empty',!c);
    setTheme($('#cpDemo'),w);
    $$('.cswatch [data-keep]').forEach(b=>b.classList.toggle('on',b.dataset.keep==='sw:'+(c||'none')));
    sv.setAttribute('aria-valuetext',hex);
  };
  const wire=()=>{
    const sv=$('#cpSV');
    const pick=e=>{
      const r=sv.getBoundingClientRect();
      hsv.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
      hsv.v=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
      set(hsvToHex(hsv),true);
    };
    sv.addEventListener('pointerdown',e=>{try{sv.setPointerCapture(e.pointerId)}catch(_){}sv.dataset.drag='1';pick(e)});
    sv.addEventListener('pointermove',e=>{if(sv.dataset.drag)pick(e)});
    const up=()=>{if(sv.dataset.drag){delete sv.dataset.drag;renderEditor();paint()}};
    sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
    sv.addEventListener('keydown',e=>{
      const d={ArrowLeft:[-.03,0],ArrowRight:[.03,0],ArrowUp:[0,.03],ArrowDown:[0,-.03]}[e.key];if(!d)return;
      e.preventDefault();
      hsv.s=Math.max(0,Math.min(1,hsv.s+d[0]));hsv.v=Math.max(0,Math.min(1,hsv.v+d[1]));
      set(hsvToHex(hsv),false);
    });
    const hue=$('#cpHue');
    hue.addEventListener('input',()=>{hsv.h=+hue.value;if(hsv.s<.05)hsv.s=.7;if(hsv.v<.05)hsv.v=.9;set(hsvToHex(hsv),true)});
    hue.addEventListener('change',()=>{renderEditor();paint()});
    const hx=$('#cpHex');
    hx.addEventListener('change',()=>{
      let v=hx.value.trim();
      if(v&&v[0]!=='#')v='#'+v;
      if(/^#[0-9a-f]{3}$/i.test(v))v='#'+[...v.slice(1)].map(c=>c+c).join('');
      if(/^#[0-9a-f]{6}$/i.test(v)){hsv=hexToHsv(v.toUpperCase());set(v.toUpperCase(),false)}
      else if(!v&&tab==='acc')set(null,false);
      else{hx.value=cur()||'';toast('Use a hex color like #3A7BD5')}
    });
    hx.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();hx.blur()}});
  };
  openSheet(body(),null,{onKeep:v=>{
    if(v.startsWith('tab:')){tab=v.slice(4);hsv=hexToHsv(cur()||w.color);$('#sheetBody').innerHTML=body();wire();paint();return}
    if(v==='sw:none'){set(null,false);return}
    if(v.startsWith('sw:')){hsv=hexToHsv(v.slice(3));set(v.slice(3),false)}
  },onClose:()=>{if(E)renderEditor()}});
  wire();paint();
}

/* Deleting workouts moves their chart data to the archive. */
function deleteWorkouts(ids){
  const set=new Set(ids),keys=[];
  for(const w of S.workouts.filter(x=>set.has(x.id))){
    keys.push(...keysOf(w));
    S.archive.push(...S.history.filter(e=>e.workoutId===w.id).map(e=>({...e,c:w.color,n:w.name})));
  }
  S.history=S.history.filter(e=>!set.has(e.workoutId));
  S.workouts=S.workouts.filter(w=>!set.has(w.id));
  for(const r of runs.filter(x=>set.has(x.wid)&&!x.w))removeRun(r,true);
  releaseMedia(keys);save();
}

/* ---------- Backup ---------- */
async function exportBackup(){
  toast('Preparing backup…');
  const media={};
  for(const k of new Set(allKeysInUse())){const b=await Store.blob(k);if(b)media[k]=await blobToDataURL(b)}
  const data={app:'interval',version:4,exported:new Date().toISOString(),state:{...S,runs:[]},media};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=`interval-backup-${dayKey(Date.now())}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Backup saved to your downloads');
}
function importBackup(){
  pickFile('application/json,.json',async f=>{
    let data=null;
    try{data=JSON.parse(await readText(f))}catch(e){}
    if(data?.app!=='interval'||!data.state||typeof data.state!=='object')return toast('That file isn’t an Interval backup');
    const when=data.exported?new Date(data.exported).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'an earlier date';
    confirmSheet('Replace everything with this backup?',`Workouts, history, archive and settings on this device will be replaced by the backup from ${esc(when)}. Running and scheduled workouts end.`,'Restore backup',()=>restoreBackup(data));
  });
}
async function restoreBackup(data){
  toast('Restoring…');
  for(const r of [...runs])stopTrack(r);
  runs.length=0;focusId=null;closeRunner();
  const old=allKeysInUse(),map={};
  for(const [k,du] of Object.entries(data.media||{})){const b=dataURLToBlob(du);if(b)map[k]=await Store.putBlob(b)}
  const st=JSON.parse(JSON.stringify(data.state),(key,val)=>key==='key'&&typeof val==='string'?(map[val]||val):val);
  S=migrate({...st,runs:[]});
  setVolume(S.settings.volume);save();
  old.forEach(k=>Store.remove(k));
  bufCache.clear();
  setDrawer(S.ui.drawer,false);
  if(screen==='settings')renderSettings();else{show('dash');renderDash()}
  toast(`Restored ${plural(S.workouts.length,'workout')}`);
}

async function fillMedia(keep=new Map()){
  await Promise.all($$('#ilist .icard').map(async card=>{
    const it=E?.w.intervals[+card.dataset.i],slot=card.querySelector('.mslot');
    if(!slot||!it?.media)return;
    const k=it.media.key+'|'+(it.media.fit||'cover'),old=keep.get(k);
    if(old){keep.delete(k);slot.replaceChildren(old);watchVideo(old);return}
    const src=await Store.url(it.media.key);
    if(!slot.isConnected)return;
    const el=src?mediaEl(it.media.type,src,it.media.fit,'managed'):missingEl();
    el.dataset.k=k;slot.replaceChildren(el);watchVideo(el);
  }));

/* Scrolls a newly added card to a spot the add button doesn't cover: just below the

  if(!card)return;
  const lr=list.getBoundingClientRect(),fr=$('#editFab').getBoundingClientRect(),cr=card.getBoundingClientRect();
  const max=list.scrollHeight-list.clientHeight,T=cr.top-lr.top+list.scrollTop,H=cr.height;
  const ft=fr.top-lr.top,fb=fr.bottom-lr.top;
  const clear=s=>{const top=T-s;return s>=0&&s<=max&&top>=0&&(top+H<=ft-6||top>=fb+6)};
  const s=[T-fb-12,T+H-ft+12,T,T+H-list.clientHeight].find(clear);

/* Length of an attached video, or of an audio track (synth included). */
const durCache=new Map();
function mediaSeconds(m){
  if(!m?.key)return Promise.resolve(0);
  if(!durCache.has(m.key)){
    durCache.set(m.key,(async()=>{
      if(m.type!=='video'){const b=await audioBuffer(m.key);return b?b.duration:0}
      const src=await Store.url(m.key);if(!src)return 0;
      return await new Promise(res=>{
        const v=document.createElement('video');
        let done=false;
        const end=x=>{if(!done){done=true;res(isFinite(x)&&x>0?x:0)}};
        v.preload='metadata';v.muted=true;
        v.onloadedmetadata=()=>end(v.duration);
        v.onerror=()=>end(0);
        setTimeout(()=>end(v.duration),4000);
        v.src=src;
      });
    })());
  }
  return durCache.get(m.key);
}

}

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function imageFromMedia(m){
  const src=await Store.url(m.key);if(!src)throw new Error('missing');
  if(m.type==='image')return loadImg(src);
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=src;
  await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=j;setTimeout(r,3000)});
  v.currentTime=Math.min(.5,(v.duration||1)/2);
  await new Promise(r=>{v.onseeked=r;setTimeout(r,1000)});
  const c=document.createElement('canvas');c.width=v.videoWidth||320;c.height=v.videoHeight||200;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return loadImg(c.toDataURL('image/jpeg',.9));
}
async function iconFromMedia(it){
  let img;try{img=await imageFromMedia(it.media)}catch(e){return toast('Could not read that image')}
  openSheet(`<h4>Make icon</h4><p class="small">Drag to position, slide to zoom.</p>
    <div class="cropview" id="crop"><img id="cropImg" alt=""></div>
    <input type="range" class="zoom" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
    <div class="dialfoot"><button class="btn" data-v="no">Cancel</button><button class="btn pri" data-v="use">Use as icon</button></div>`,v=>{
    if(v!=='use')return;
    const c=document.createElement('canvas');c.width=c.height=96;
    const k=st.s0*st.z;
    c.getContext('2d').drawImage(img,-st.x/k,-st.y/k,st.V/k,st.V/k,0,0,96,96);
    it.iconImg=c.toDataURL('image/jpeg',.82);
    changed(it);
  });
  const view=$('#crop'),el=$('#cropImg');el.src=img.src;
  const V=view.clientWidth,iw=img.naturalWidth,ih=img.naturalHeight,s0=V/Math.min(iw,ih);
  const st={V,s0,z:1,x:(V-iw*s0)/2,y:(V-ih*s0)/2};
  const clamp=()=>{const k=s0*st.z;st.x=Math.min(0,Math.max(V-iw*k,st.x));st.y=Math.min(0,Math.max(V-ih*k,st.y))};
  const draw=()=>{clamp();el.style.width=iw*s0*st.z+'px';el.style.transform=`translate(${st.x}px,${st.y}px)`};
  draw();
  let drag=null;
  view.onpointerdown=e=>{view.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY}};
  view.onpointermove=e=>{if(!drag)return;st.x+=e.clientX-drag.x;st.y+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};draw()};
  view.onpointerup=view.onpointercancel=()=>drag=null;
  $('#cropZoom').oninput=e=>{
    const z=+e.target.value,k0=s0*st.z,cx=(V/2-st.x)/k0,cy=(V/2-st.y)/k0;
    st.z=z;const k=s0*z;st.x=V/2-cx*k;st.y=V/2-cy*k;draw();
  };
}

/* ================= Stopwatch =================
   Lap cuts an interval at that moment; Stop closes the one still running. */
const WT={on:false,start:0,acc:0,paused:true,mark:0,laps:[],raf:0};
const wElapsed=()=>WT.paused?WT.acc:WT.acc+(Date.now()-WT.start);
const watchFmt=ms=>{const t=Math.max(0,ms)/1000;return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}.${Math.floor((t%1)*10)}`};
function openWatch(){
  if(!E)return;
  Object.assign(WT,{on:true,start:0,acc:0,paused:true,mark:0,laps:[]});
  $('#watch').classList.remove('hidden');
  document.body.classList.add('watching');
  renderWatch();
  const step=()=>{
    if(!WT.on)return;
    const e=wElapsed();
    $('#wTotal').textContent=watchFmt(e);
    $('#wLap').textContent=`Lap ${watchFmt(e-WT.mark)}`;
    WT.raf=requestAnimationFrame(step);
  };
  cancelAnimationFrame(WT.raf);step();
}
function renderWatch(){
  const running=!WT.paused;
  $('#wGo').innerHTML=running?`${ui('pause','icon sm')}Pause`:`${ui('play','icon sm fill')}${WT.acc?'Resume':'Start'}`;
  $('#wLapBtn').disabled=!running;
  $('#wStop').disabled=WT.paused&&!WT.acc;
  const L=$('#wList');
  L.innerHTML=WT.laps.length?WT.laps.map((ms,i)=>`<div class="wrow"><span>Interval ${i+1}</span><b class="num">${fmt(Math.max(1,Math.round(ms/1000)))}</b></div>`).join('')
    :`<div class="whint">Start the stopwatch and tap Lap each time an interval ends. Stop closes the last one and adds them all.</div>`;
  L.scrollTop=L.scrollHeight;
}
function watchGo(){
  if(WT.paused){WT.start=Date.now();WT.paused=false}
  else{WT.acc+=Date.now()-WT.start;WT.paused=true}
  renderWatch();
}
function watchLap(){
  if(WT.paused)return;
  const e=wElapsed();
  if(e-WT.mark<300)return;
  WT.laps.push(e-WT.mark);WT.mark=e;haptic(30);renderWatch();
}
function watchStop(){
  const e=wElapsed();
  if(!WT.paused){WT.acc=e;WT.paused=true}
  if(e-WT.mark>=300)WT.laps.push(e-WT.mark);
  const laps=WT.laps.filter(ms=>ms>=300);
  closeWatch(true);
  if(!E||!laps.length)return;
  for(const ms of laps){
    const d=Math.max(1,Math.round(ms/1000));
    E.w.intervals.push({id:uid(),title:'',icon:null,iconImg:null,duration:d,mode:d>=60?'m':'s',media:null,audio:null,cues:{}});
  }
  renderEditor();revealNewCard();
  toast(`Added ${plural(laps.length,'interval')}`);
}
function closeWatch(force){
  if(!force&&(WT.laps.length||wElapsed()>1500)){
    confirmSheet('Discard this stopwatch?','The laps you have taken will be lost.','Discard',()=>closeWatch(true),'Keep going');
    return;
  }
  WT.on=false;cancelAnimationFrame(WT.raf);WT.laps=[];
  $('#watch').classList.add('hidden');
  document.body.classList.remove('watching');
}

  $('#wClose').innerHTML=ui('close');

    if(gp)return gapSheet(+gp.dataset.gap);

      case 'rmaudio':e.stopPropagation();stopPreview();{const k=it.audio.key;it.audio=null;renderEditor();releaseMedia([k])}break;
      case 'clock':openDial(i,t);break;

          <button data-v="up" ${i===0?'disabled':''}>${ui('up')}Move up</button>
          <button data-v="down" ${i===n-1?'disabled':''}>${ui('down')}Move down</button>
          <button data-v="del" class="red">${ui('trash')}Delete interval</button></div>`,v=>{
          const L=E.w.intervals;
          if(v==='track'){setTimeout(()=>trackSheet(it),0);return}
          if(v==='fitdur'){matchDuration(it,it.media?.type==='video'?'media':'audio');return}
          if(v==='dup')L.splice(i+1,0,{...structuredClone(it),id:uid()});
          if(v==='up'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
          if(v==='down'&&i<n-1)[L[i+1],L[i]]=[L[i],L[i+1]];
          if(v==='del'){stopPreview();L.splice(i,1);releaseMedia([it.media?.key,it.audio?.key,it.cues?.start?.key,it.cues?.end?.key])}

/* ================= Duration dial ================= */
let D=null,dialT=0;
const R_OUT=126,R_IN=84,C_OUT=TAU*R_OUT,C_IN=TAU*R_IN;
const PRESETS={s:[10,15,20,30,45,60,90],m:[60,120,180,300,600,900,1200]};

function dialHTML(){
  const ticks=Array.from({length:60},(_,k)=>{const a=k/60*TAU,big=k%5===0,r1=106,r2=big?97:101;
    return `<line class="dtick" stroke-width="${big?2:1}" x1="${150+r1*Math.sin(a)}" y1="${150-r1*Math.cos(a)}" x2="${150+r2*Math.sin(a)}" y2="${150-r2*Math.cos(a)}"/>`}).join('');
  return `
    <div class="modes" role="tablist"><button data-m="s" role="tab">Seconds</button><button data-m="m" role="tab">Minutes</button></div>
    <svg class="dialsvg" id="dialSvg" viewBox="0 0 300 300" aria-label="Drag around the ring to set duration">
      <circle class="dtrack" cx="150" cy="150" r="${R_OUT}" stroke-width="22"/>
      <circle class="dfull" id="dFull" cx="150" cy="150" r="${R_OUT}" stroke-width="22"/>
      <circle class="darc" id="dArc" cx="150" cy="150" r="${R_OUT}" stroke-width="22" transform="rotate(-90 150 150)" stroke-dasharray="0 ${C_OUT}"/>
      <circle class="dknob" id="dKnob" r="14" cx="150" cy="${150-R_OUT}"/>
      <g id="dTicks">${ticks}</g>
      <g id="dInner">
        <circle class="dtrack" cx="150" cy="150" r="${R_IN}" stroke-width="14"/>
        <circle class="darc" id="dArcIn" cx="150" cy="150" r="${R_IN}" stroke-width="14" transform="rotate(-90 150 150)" stroke-dasharray="0 ${C_IN}" opacity=".75"/>
        <circle class="dknob" id="dKnobIn" r="10" cx="150" cy="${150-R_IN}"/>
      </g>
      <text class="dval num" id="dVal" x="150" y="160" text-anchor="middle"></text>
      <text class="dsub" id="dSub" x="150" y="186" text-anchor="middle"></text>
      <text class="dlap" id="dLap" x="150" y="118" text-anchor="middle"></text>
    </svg>
    <div class="presets" id="dPresets"></div>
    <div class="dialfoot"><button class="btn" id="dCancel">Cancel</button><button class="btn pri" id="dDone">Set duration</button></div>`;
}

function openDial(i,fromEl){
  clearTimeout(dialT);
  const it=E.w.intervals[i];
  D={i,mode:it.mode||'s',dur:it.duration,from:fromEl,drag:null,lastShown:null};
  const ov=$('#dial'),card=$('#dialCard');
  card.innerHTML=dialHTML();card.style.setProperty('--c',E.w.color);
  ov.classList.remove('hidden');
  bindDial();updateDial();
  const f=flipFrom(fromEl);
  card.style.transition='none';card.style.transform=f;card.style.opacity='.3';
  card.getBoundingClientRect();
  requestAnimationFrame(()=>{
    card.style.transition='transform .36s cubic-bezier(.2,.9,.25,1),opacity .2s';
    card.style.transform='none';card.style.opacity='1';ov.classList.add('open');
  });
}
function flipFrom(el){
  const card=$('#dialCard'),svg=$('#dialSvg');
  const prev=card.style.transform;card.style.transform='none';
  const a=el.getBoundingClientRect(),c=card.getBoundingClientRect(),v=svg.getBoundingClientRect();
  card.style.transform=prev;
  const s=a.width/v.width;
  return `translate(${a.left-c.left-s*(v.left-c.left)}px,${a.top-c.top-s*(v.top-c.top)}px) scale(${s})`;
}
function closeDial(commit){
  const it=E.w.intervals[D.i];
  if(commit){it.duration=D.dur;it.mode=D.mode}
  const ov=$('#dial'),card=$('#dialCard'),from=D.from;
  if(from.isConnected){from.innerHTML=miniClock(it);from.setAttribute('aria-label',`Duration ${fmt(it.duration)}, tap to change`)}
  updateTotal();
  const target=from.isConnected?flipFrom(from):'scale(.8)';
  card.style.transition='transform .28s cubic-bezier(.4,0,.6,1),opacity .28s';
  card.style.transform=target;card.style.opacity='0';ov.classList.remove('open');
  D=null;
  dialT=setTimeout(()=>{ov.classList.add('hidden');card.style.transform='';card.style.opacity=''},290);
}

function updateDial(){
  const d=D.dur,m=D.mode==='m';
  let frac,laps,val,sub,lapLabel;
  if(!m){frac=(d%60)/60;laps=Math.floor(d/60);val=String(d);sub=d>=60?`${fmt(d)} (min:sec)`:'seconds';lapLabel=laps?plural(laps,'full minute'):''}
  else{const mins=Math.floor(d/60);frac=(mins%60)/60;laps=Math.floor(mins/60);val=fmt(d);sub='outer ring: minutes, inner: seconds';lapLabel=laps?plural(laps,'hour'):''}
  $('#dArc').setAttribute('stroke-dasharray',`${frac*C_OUT} ${C_OUT}`);
  $('#dFull').style.display=laps?'':'none';
  const a=frac*TAU;
  $('#dKnob').setAttribute('cx',150+R_OUT*Math.sin(a));$('#dKnob').setAttribute('cy',150-R_OUT*Math.cos(a));
  $('#dInner').style.display=m?'':'none';
  $('#dTicks').style.display=m?'none':'';
  if(m){const f=(d%60)/60,b=f*TAU;
    $('#dArcIn').setAttribute('stroke-dasharray',`${f*C_IN} ${C_IN}`);
    $('#dKnobIn').setAttribute('cx',150+R_IN*Math.sin(b));$('#dKnobIn').setAttribute('cy',150-R_IN*Math.cos(b));}
  const vt=$('#dVal');vt.textContent=val;vt.setAttribute('font-size',val.length<=3?60:val.length<=5?50:40);
  vt.setAttribute('y',m?152:162);
  $('#dSub').textContent=sub;$('#dSub').setAttribute('y',m?178:188);
  $('#dLap').textContent=lapLabel;$('#dLap').setAttribute('y',m?124:116);
  $$('#dialCard .modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===D.mode));
  $('#dPresets').innerHTML=PRESETS[D.mode].map(p=>`<button class="chip ${p===d?'on':''}" data-p="${p}">${m?`${p/60} min`:`${p} s`}</button>`).join('');
  if(D.lastShown!==null&&D.lastShown!==d&&(m||d%5===0))buzz(4);
  D.lastShown=d;
}

function bindDial(){
  const svg=$('#dialSvg'),card=$('#dialCard'),ov=$('#dial');
  const pt=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*300,y:(e.clientY-r.top)/r.height*300}};
  const ang=p=>{let a=Math.atan2(p.x-150,-(p.y-150));return a<0?a+TAU:a};
  const setInner=a=>{const s=Math.round(a/TAU*60)%60;D.dur=Math.max(1,Math.floor(D.dur/60)*60+s);updateDial()};
  svg.onpointerdown=e=>{
    const p=pt(e),r=Math.hypot(p.x-150,p.y-150);if(r<34)return;
    e.preventDefault();svg.setPointerCapture(e.pointerId);
    const ring=D.mode==='m'&&r<105?'inner':'outer';
    D.drag={ring,last:ang(p),f:D.mode==='s'?D.dur:Math.floor(D.dur/60)};
    if(ring==='inner')setInner(ang(p));
  };
  svg.onpointermove=e=>{
    if(!D?.drag)return;
    const a=ang(pt(e));
    if(D.drag.ring==='inner')return setInner(a);
    let da=a-D.drag.last;if(da>Math.PI)da-=TAU;if(da<-Math.PI)da+=TAU;
    D.drag.last=a;D.drag.f=Math.max(0,D.drag.f+da/TAU*60);
    if(D.mode==='s')D.dur=Math.max(1,Math.min(5999,Math.round(D.drag.f)));
    else D.dur=Math.max(1,Math.min(599,Math.round(D.drag.f))*60+D.dur%60);
    updateDial();
  };
  svg.onpointerup=svg.onpointercancel=()=>{if(D)D.drag=null};
  card.onclick=e=>{
    const m=e.target.closest('[data-m]');if(m){D.mode=m.dataset.m;updateDial();return}
    const p=e.target.closest('[data-p]');if(p){D.dur=+p.dataset.p;updateDial();return}
    if(e.target.closest('#dDone'))closeDial(true);
    if(e.target.closest('#dCancel'))closeDial(false);
  };
  ov.onclick=e=>{if(e.target===ov&&D)closeDial(true)};
}

/* ================= Workout runs =================
   A run is pinned to the wall clock: elapsed = now − anchor, frozen while paused.
   That one model covers seeking, syncing to a start or end time, scheduled starts,
   several workouts at once, and picking back up after the page reloads.
   Logic ticks every 100 ms; the runner redraws on rAF only while it is visible.  */
const runs=[];
let focusId=null,lastSave=0,wakeLock=null;
const RUN_FIELDS=['id','wid','w','anchor','plan','pausedAt','active','tick','done','doneAt','logged','muted','created','scale'];
const REPEAT_N={none:'',daily:'Every day',weekdays:'Weekdays',weekly:'Every week'};
const workoutOf=r=>r?.w||S.workouts.find(x=>x.id===r?.wid)||null;
const offsetMs=(w,i)=>timeline(w).segs.find(s=>s.kind==='int'&&s.idx===i)?.start??0;
const repeats=plan=>!!plan&&!!plan.repeat&&plan.repeat!=='none';
/* The workout start implied by "scope starts/ends at plan.at" (scope −1 = whole workout). */
function planAnchor(w,plan){
  let off=plan.edge==='end'?total(w)*1000:0;
  if(plan.scope>=0&&plan.scope<w.intervals.length){
    off=offsetMs(w,plan.scope);
    if(plan.edge==='end')off+=w.intervals[plan.scope].duration*1000;
  }
  return plan.at-off;
}
function anchorOf(r){
  if(r.anchor!=null)return r.anchor;
  const w=workoutOf(r);
  return w&&r.plan?planAnchor(w,r.plan):Date.now();
}
const elapsedOf=(r,now=Date.now())=>(r.pausedAt??now)-anchorOf(r);
const isWaiting=r=>!r.done&&elapsedOf(r)<0;
const isLive=r=>!r.done&&!isWaiting(r);
function posAt(w,el){
  const segs=timeline(w).segs;
  if(el<0||!segs.length)return{si:-1,seg:null,idx:0,el:0};
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(el<s.start+s.dur)return{si:i,seg:s,el:el-s.start,idx:s.kind==='int'?s.idx:Math.min(s.k,w.intervals.length-1)};
  }
  const s=segs.at(-1);
  return{si:segs.length-1,seg:s,el:s.dur,idx:w.intervals.length-1,done:true};
}
function nextOccurrence(at,repeat){
  const d=new Date(at);
  d.setDate(d.getDate()+(repeat==='weekly'?7:1));
  if(repeat==='weekdays')while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);
  return d.getTime();
}
function persistRuns(){
  S.runs=runs.map(r=>{const o={};for(const k of RUN_FIELDS)if(r[k]!=null)o[k]=r[k];return o});
  lastSave=Date.now();save();
}
function makeRun(wid,plan=null){
  const r={id:uid(),wid,w:null,anchor:null,plan,pausedAt:null,active:0,tick:null,done:false,logged:false,muted:false,created:Date.now()};
  runs.push(r);
  return r;
}
function prepAudio(w){
  [w.cues?.start,w.cues?.end,w.cues?.done,w.cues?.tstart,w.cues?.tend,...Object.values(S.settings.cues),...w.intervals.flatMap(i=>[i.cues?.start,i.cues?.end])]
    .forEach(c=>{if(c?.kind==='media')audioBuffer(c.key);if(c?.kind==='synth')synthBuffer(c.p)});
}
function startNow(wid){
  const w=S.workouts.find(x=>x.id===wid);if(!w||!total(w))return;
  ensureAudio();unlockSpeech();prepAudio(w);
  const r=makeRun(wid),now=Date.now();
  Object.assign(r,{w:snapshot(w),anchor:now,tick:now,liveBegin:true});
  focusId=r.id;persistRuns();requestWake();tickRuns();openRunner(r.id);
}
/* New run from the timing sheet: past anchors start part-way through, future ones wait. */
/* New run from the timing sheet. A past time either scales the workout into the
   window that is left (the default) or starts it part-way through. */
function planRun(wid,plan){
  const w=S.workouts.find(x=>x.id===wid);if(!w||!total(w))return;
  const a=planAnchor(w,plan),now=Date.now(),T=total(w)*1000,endAt=a+T;
  if(a<=now&&endAt-now<5000)return toast('That time has already passed');
  ensureAudio();unlockSpeech();prepAudio(w);
  const r=makeRun(wid,{...plan});
  if(a<=now){
    Object.assign(r,{w:snapshot(w),anchor:plan.mode==='jump'?a:now,tick:now,liveBegin:true});
    if(plan.mode!=='jump')scaleRunTo(r,endAt,now);
    focusId=r.id;persistRuns();requestWake();tickRuns();openRunner(r.id);
  }else{
    persistRuns();refreshScreen();
    toast(`Starts ${whenLabel(a)}`);
  }
}
function tickRuns(){
  const now=Date.now();let changed=false;
  for(const r of [...runs]){
    if(r.done)continue;
    const src=workoutOf(r);
    if(!src){removeRun(r,true);changed=true;continue}
    const a=anchorOf(r),el=(r.pausedAt??now)-a;
    // Count real progress only: the overlap of this tick with the workout's window.
    if(r.w&&!r.pausedAt&&r.tick!=null){
      const lo=Math.max(r.tick,a),hi=Math.min(now,a+total(r.w)*1000);
      if(hi>lo)r.active+=hi-lo;
    }
    r.tick=now;
    if(el<0){
      if(!r.wait){r.wait=true;changed=true}
      if(r.lastSi!=null||r.track){stopTrack(r);r.lastSi=null}
      continue;
    }
    if(r.wait){r.wait=false;changed=true}
    if(!r.w){r.w=snapshot(src);r.anchor=a;prepAudio(r.w);requestWake();changed=true}
    const w=r.w,tl=timeline(w),p=posAt(w,el);
    if(p.done){
      finishRun(r,r.forceLive||(!r.jumped&&now-(a+tl.total)<1500));
      changed=true;continue;
    }
    if(p.si!==r.lastSi){
      const first=r.lastSi==null;
      const natural=!r.jumped&&(first?(r.liveBegin||p.el<1500):(p.si===r.lastSi+1&&p.el<1500));
      if(!r.muted&&!r.pausedAt&&(natural||r.cueOnJump)){
        if(first||r.cueOnJump)enterCue(r,p.si);else segCues(r,r.lastSi,p.si);
        haptic(60);
      }
      r.lastSi=p.si;
      restartTrack(r);
      if(r.id===focusId&&runVisible())showInterval(r);
      changed=true;
    }
    // The 3-2-1 beeps count down to the next interval, across any transition.
    if(!r.pausedAt&&!r.muted&&countdownOn(w)){
      const whole=Math.ceil((tl.nextInt[p.si]-el)/1000);
      if(whole!==r.lastWhole){
        if(!r.jumped&&r.lastWhole===whole+1&&whole>=1&&whole<=3)countBeep();
        r.lastWhole=whole;
      }
    }
    r.jumped=r.cueOnJump=r.liveBegin=r.forceLive=false;
  }
  if(changed){persistRuns();refreshScreen()}
  else if(now-lastSave>5000&&runs.some(r=>r.w&&!r.done&&!r.pausedAt))persistRuns();
  updateRunsUI();
}
function enterCue(r,si){
  const w=r.w,s=timeline(w).segs[si],it=segSubject(w,s);
  playCue(s.kind==='int'?cueOf(w,it,'start'):wCue(w,'tstart'),it);
}
function segCues(r,from,to){
  const w=r.w,segs=timeline(w).segs,a=segs[from],b=segs[to],prev=segSubject(w,a),next=segSubject(w,b);
  const had=playCue(a.kind==='int'?cueOf(w,prev,'end'):wCue(w,'tend'),prev);
  const c=b.kind==='int'?cueOf(w,next,'start'):wCue(w,'tstart');
  setTimeout(()=>{if(!r.done&&!r.pausedAt&&!r.muted&&r.lastSi===to)playCue(c,next)},had?550:0);
}
function stopTrack(r){r.trackTok=(r.trackTok||0)+1;if(r.track){r.track.stop();r.track=null}}
function restartTrack(r){
  stopTrack(r);
  if(!r.w||r.done||r.pausedAt||r.muted)return;
  const el=elapsedOf(r);if(el<0)return;
  const p=posAt(r.w,el);
  if(p.done||p.seg.kind!=='int')return;
  const it=r.w.intervals[p.seg.idx];if(!it.audio)return;
  const tok=r.trackTok;
  trackBuffer(it.audio).then(b=>{
    if(!b||r.trackTok!==tok||r.done||r.pausedAt||r.muted)return;
    const q=posAt(r.w,elapsedOf(r));
    if(q.done||q.si!==p.si)return;
    r.track=playBuffer(b,q.el/1000,!!it.audio.loop);
  });
}
function logRun(r){
  const sec=Math.round(r.active/1000);
  if(r.logged||!r.w||sec<5)return;
  r.logged=true;
  const e={id:uid(),date:dayKey(Date.now()),workoutId:r.wid,seconds:sec,c:r.w.color,n:r.w.name};
  (S.workouts.some(w=>w.id===r.wid)?S.history:S.archive).push(e);
  save();
}
function finishRun(r,live){
  r.done=true;r.doneAt=Date.now();r.pausedAt=null;stopTrack(r);
  logRun(r);
  if(live&&!r.muted){
    const w=r.w,last=timeline(w).segs.at(-1),it=segSubject(w,last);
    const had=playCue(last.kind==='int'?cueOf(w,it,'end'):wCue(w,'tend'),it);
    const dc=w.cues?.done||S.settings.cues.done;
    setTimeout(()=>playCue(dc,it),had?700:0);
  }
  haptic(200);
  if(repeats(r.plan))scheduleNext(r);
  releaseWake();
  if(screen==='dash')renderMainChart();
  if(r.id===focusId&&runVisible())renderRunner();
}
/* Repeating schedules: the next occurrence becomes its own waiting run. */
function scheduleNext(r){
  const w=S.workouts.find(x=>x.id===r.wid);
  const plan=r.plan;r.plan={...plan,repeat:'none'};
  if(!w)return null;
  let at=plan.at;
  do at=nextOccurrence(at,plan.repeat);while(planAnchor(w,{...plan,at})<=Date.now());
  return makeRun(r.wid,{...plan,at});
}
function removeRun(r,quiet){
  stopTrack(r);
  const i=runs.indexOf(r);if(i>=0)runs.splice(i,1);
  if(r.w)releaseMedia(keysOf(r.w));
  if(focusId===r.id){
    focusId=null;
    const nx=runs.find(isLive)||runs[0];
    if(nx&&runVisible()){focusId=nx.id;renderRunner()}else closeRunner();
  }
  persistRuns();releaseWake();
  if(!quiet){refreshScreen();if(screen==='dash')renderMainChart()}
  updateRunsUI(true);
}
function endRun(r){
  if(!r.done){
    tickRuns();

      <div class="menu">

        <button data-v="keep">${ui('back')}Keep it</button>

function setPaused(r,p){
  if(!r||!r.w||!isLive(r))return;
  const now=Date.now();
  if(p&&!r.pausedAt){
    tickRuns();if(r.done)return;
    r.pausedAt=now;stopTrack(r);
    if('speechSynthesis' in window)speechSynthesis.cancel();
  }else if(!p&&r.pausedAt){
    r.anchor+=now-r.pausedAt;r.pausedAt=null;r.tick=now;restartTrack(r);
  }

function beginNow(r){

  const now=Date.now();
  Object.assign(r,{w:r.w||snapshot(w),anchor:now,pausedAt:null,tick:now,liveBegin:true,lastSi:null});

/* Seeking moves the anchor; a jump to another interval can announce it. */
/* Seeking moves the anchor, so the clock times follow along. */
function seekSeg(r,si,ms,cue){
  if(!r?.w||!isLive(r))return;
  const s=timeline(r.w).segs[si];if(!s)return;
  const target=s.start+Math.max(0,Math.min(ms,s.dur-50));
  r.anchor=(r.pausedAt??Date.now())-target;
  r.jumped=true;r.cueOnJump=!!cue&&!r.pausedAt;r.lastWhole=null;
  if(r.lastSi===si){restartTrack(r);r.cueOnJump=false}
  tickRuns();persistRuns();

}
const seekTo=(r,i,ms,cue)=>{if(r?.w)seekSeg(r,segOfInterval(r.w,i),ms,cue)};
function jumpRun(r,delta){
  if(!r?.w||!isLive(r))return;
  const tl=timeline(r.w),p=posAt(r.w,elapsedOf(r));
  if(delta<0&&p.el>2000)return seekSeg(r,p.si,0,false);
  const n=p.si+delta;
  if(n<0)return seekSeg(r,0,0,false);
  if(n>=tl.segs.length){
    r.forceLive=!r.pausedAt;
    r.anchor=(r.pausedAt??Date.now())-tl.total-1;

function syncRun(r,plan){
  const w=r.w,now=Date.now(),a=planAnchor(w,plan),T=timeline(w).total,endAt=a+T;
  if(plan.mode!=='jump'&&a<=now){
    if(endAt-now<5000)return toast('That is too close to fit the rest in');
    const el=Math.max(0,elapsedOf(r,now));
    Object.assign(r,{anchor:now-el,pausedAt:null,tick:now,jumped:true,lastWhole:null});
    if(!scaleRunTo(r,endAt,now))return toast('Nothing left to fit');
    restartTrack(r);tickRuns();persistRuns();
    if(runVisible())renderRunner();
    refreshScreen();
    return toast(`Rescaled to finish ${clockTime(endAt)}`);
  }
  if(now-a>=T)return toast('That time is already past the end of the workout');
  Object.assign(r,{anchor:a,pausedAt:null,tick:now,jumped:true,lastWhole:null});
  if(a>now){r.lastSi=null;stopTrack(r)}else restartTrack(r);
  tickRuns();persistRuns();
  if(runVisible())renderRunner();
  refreshScreen();
  toast(a>now?`Waiting until ${clockTime(a)}`:`Synced: ends ${clockTime(a+T)}`);
}
function updatePlan(r,plan){
  const w=workoutOf(r),now=Date.now(),a=planAnchor(w,plan),T=total(w)*1000;
  if(a<=now&&a+T-now<5000)return toast('That time is already past the end of the workout');
  r.plan={...plan};
  if(a<=now&&plan.mode!=='jump'){
    Object.assign(r,{w:r.w||snapshot(w),anchor:now,pausedAt:null,liveBegin:true});
    scaleRunTo(r,a+T,now);
  }else if(r.w&&r.anchor!=null){r.anchor=a;r.pausedAt=null;if(a<=now)r.liveBegin=true}
  else if(a<=now)r.liveBegin=true;
  r.lastSi=null;r.tick=now;
  tickRuns();persistRuns();refreshScreen();
  if(r.id===focusId&&runVisible())renderRunner();
  if(a>now)toast(`Starts ${whenLabel(a)}`);
}
/* After a reload: runs pick up where the clock says they are. Schedules whose whole
   window passed while the page was closed are dropped, or rolled forward if repeating. */
function restoreRuns(){
  const now=Date.now(),missed=[];
  for(const o of S.runs||[]){
    const r={w:null,anchor:null,plan:null,pausedAt:null,active:0,tick:null,done:false,logged:false,muted:false,...o};
    const w=workoutOf(r);
    if(!w||(!r.w&&!r.plan))continue;
    if(r.done&&now-(r.doneAt||0)>3600e3)continue;
    if(!r.w){
      const T=total(w)*1000;
      if(!T)continue;
      if(now-planAnchor(w,r.plan)>=T){
        if(!repeats(r.plan)){missed.push(w.name);continue}
        let at=r.plan.at;
        do at=nextOccurrence(at,r.plan.repeat);while(planAnchor(w,{...r.plan,at})+T<=now);
        r.plan={...r.plan,at};
      }
    }
    runs.push(r);
  }
  if(missed.length)setTimeout(()=>toast(`Missed a scheduled start: ${missed.join(', ')}`),700);
  persistRuns();
}
function requestWake(){
  if(!S.settings.wake||wakeLock||!navigator.wakeLock)return;
  try{
    wakeLock='pending';
    navigator.wakeLock.request('screen').then(l=>{
      wakeLock=l;l.addEventListener?.('release',()=>{if(wakeLock===l)wakeLock=null});
      if(!runs.some(r=>r.w&&!r.done))releaseWake();
    }).catch(()=>{wakeLock=null});
  }catch(e){wakeLock=null}
}
function releaseWake(){
  if(runs.some(r=>r.w&&!r.done)&&S.settings.wake)return;
  if(wakeLock&&wakeLock!=='pending')wakeLock.release?.().catch?.(()=>{});
  if(wakeLock!=='pending')wakeLock=null;
}

function showInterval(r){
  const w=workoutOf(r),box=$('#rMedia'),run=$('#run');

/* Rail geometry is measured once per interval, not per frame. */
/* Rail geometry is measured once per segment, not per frame. */
function railGeo(){
  RE.fill=$('#railFill');

  RE.geo=runVisible()&&el&&rail?{x:el.offsetLeft,w:el.offsetWidth,rw:rail.clientWidth}:null;

function setT(el,v,k){if(RE.shown[k]!==v){RE.shown[k]=v;el.textContent=v}}
function setS(el,prop,v,k){if(RE.shown[k]!==v){RE.shown[k]=v;el.style[prop]=v}}
function drawRunner(force){
  const r=focusRun();if(!r)return;
  if(force)RE.shown={};
  const w=workoutOf(r),now=Date.now(),T=total(w)*1000;
  if(r.done){
    if(RE.si!==-1)return renderRunner();
    setT(RE.time,'Done','t');RE.time.classList.remove('long');
    setT(RE.left,`${fmt(r.active/1000)} trained`,'l');
    setS(RE.arc,'strokeDashoffset','0','a');
    if(RE.fill)setS(RE.fill,'transform','scaleX(1)','f');
    return;
  }
  const el=elapsedOf(r,now);
  if(el<0){
    if(RE.si!==-2)return renderRunner();
    const tt=untilLabel(-el);
    setT(RE.time,tt,'t');RE.time.classList.toggle('long',tt.length>5);
    setT(RE.left,`${fmt(T/1000)} workout · ends ${clockTime(anchorOf(r)+T)}`,'l');
    setS(RE.arc,'strokeDashoffset','565.49','a');
    return;
  }
  if(RE.si<0)return renderRunner();
  const p=posAt(w,el);
  if(p.done)return;
  if(p.si!==RE.si){showInterval(r);RE.shown={}}
  const d=p.seg.dur;
  const shownEl=RE.seeking?Math.min(d,+RE.range.value*1000):p.el;
  const rem=Math.max(0,d-shownEl);
  const tt=fmt(Math.ceil(rem/1000));
  setT(RE.time,tt,'t');RE.time.classList.toggle('long',tt.length>5);
  setT(RE.left,`${fmt(Math.ceil((T-el)/1000))} left · ends ${clockTime(now+T-el)}${scaleLabel(r)}`,'l');
  setS(RE.arc,'strokeDashoffset',(565.49*(1-rem/d)).toFixed(1),'a');
  if(!RE.seeking){const v=(p.el/1000).toFixed(1);if(RE.shown.rv!==v){RE.shown.rv=v;RE.range.value=v}}
  setT(RE.el,fmt(Math.floor(shownEl/1000)),'e');
  setT(RE.rem,'−'+fmt(Math.ceil(rem/1000)),'m');

    const px=Math.max(0,RE.geo.x+RE.geo.w*Math.min(1,shownEl/d)-10);
    setS(RE.fill,'transform',`scaleX(${Math.min(1,px/Math.max(1,RE.geo.rw-10)).toFixed(4)})`,'f');
  }
}

  $('#eBack').innerHTML=ui('back');$('#eDel').innerHTML=ui('trash');
  $('#dBack').innerHTML=ui('back');$('#dEdit').innerHTML=ui('edit');$('#dTime').innerHTML=ui('clock');
  $('#sBack').innerHTML=ui('back');$('#setBtn').innerHTML=ui('gear');$('#dAgain').innerHTML=ui('playplus','icon fill');
  $('#eWatch').innerHTML=ui('watch','icon sm');
  sideDraggable($('#dashFab'),$('#dashTop'),'dashFab',()=>openEditor(null,'dash'));
  $('#cards').addEventListener('click',e=>{
    const ed=e.target.closest('[data-edit]');if(ed)return openEditor(ed.dataset.edit,'dash');
    const ag=e.target.closest('[data-again]');if(ag)return startNow(ag.dataset.again);
    const pl=e.target.closest('[data-play]');if(pl)return playFromCard(pl.dataset.play);
    const op=e.target.closest('[data-open]');if(op)openDetail(op.dataset.open);
  });
  $('#runs').addEventListener('click',e=>{const b=e.target.closest('[data-run]');if(b)openRunner(b.dataset.run)});
  $('#setBtn').onclick=openSettings;
  $('#sBack').onclick=()=>{show('dash');renderDash()};
  $('#dBack').onclick=()=>{show('dash');renderDash()};
  $('#dEdit').onclick=()=>openEditor(detailId,'detail');
  $('#dStart').onclick=()=>playFromCard(detailId);
  $('#dTime').onclick=()=>timingSheet({wid:detailId});
  $('#dAgain').onclick=()=>startNow(detailId);
  $('#dRuns').addEventListener('click',onRunRowAction);
  $('#rng').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;S.ui.range=b.dataset.r;S.ui.chartOff=0;save();renderMainChart()};
  bindDrawer();bindSettings();bindEditor();bindRun();bindCamera();bindDraw();bindWatch();bindSheetDrag();
  let chartFrame=0;
  new ResizeObserver(()=>{cancelAnimationFrame(chartFrame);chartFrame=requestAnimationFrame(renderMainChart)}).observe($('#chart'));
  document.addEventListener('keydown',onKey);
}
/* Media left behind by an interrupted session is cleared once, shortly after start. */
async function sweepOrphans(){
  const used=new Set(allKeysInUse());
  for(const k of await Store.keys())if(!used.has(k)&&!Store.isFresh(k))Store.remove(k);
}
(async()=>{
  bind();
  await Store.open();
  const v=await Store.loadState();
  if(v&&typeof v==='object')S=migrate(v);
  restoreRuns();
  setDrawer(S.ui.drawer,false);
  show('dash');renderDash();
  tickRuns();
  setInterval(tickRuns,100);
  setTimeout(sweepOrphans,5000);
  if(!Store.durable)setTimeout(()=>toast('This browser is limiting storage, so changes may not be kept'),800);
})();
</script>
